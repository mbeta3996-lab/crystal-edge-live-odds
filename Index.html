

<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#fff">

<title>CRYSTAL EDGE</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#fff;color:#111;font:15px -apple-system,BlinkMacSystemFont,sans-serif}

main{max-width:760px;margin:auto;padding:14px 12px 35px}

header,.status,.filters,.meta,.matchhead,.foot{display:flex;align-items:center;justify-content:space-between;gap:8px}

header{margin-bottom:15px}.brand{font-weight:700;font-size:14px;letter-spacing:.4px}

.status,.meta,.sub,.foot{font-size:12px;color:#777}

.dot{display:inline-block;width:8px;height:8px;background:#c33;border-radius:50%;margin-right:5px}

.dot.on{background:#16803b}

form{display:flex;gap:7px;margin-bottom:10px}

input,button{font:inherit;border:1px solid #d5d5d5;border-radius:8px;background:white;color:#111;min-height:42px}

input{min-width:0;width:100%;padding:0 11px}

button{padding:0 12px;cursor:pointer}

.filters{justify-content:flex-start;flex-wrap:wrap;margin:10px 0}

.pill{min-height:34px;font-size:13px;padding:0 12px}

.pill.active{background:#111;color:#fff;border-color:#111}

.meta{padding:9px 0;border-top:1px solid #ddd;border-bottom:1px solid #ddd}

#message{padding:15px 2px;color:#777;font-size:13px}

.match{border:1px solid #ddd;border-radius:10px;padding:12px;margin:10px 0}

.matchhead{align-items:flex-start;margin-bottom:12px}

.title{font-weight:650;font-size:14px;overflow-wrap:anywhere}

.sub{margin-top:4px}.actions{display:flex;gap:5px;flex-shrink:0}

.small{font-size:12px;min-height:30px;padding:0 8px}

.outcomes{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.outcome{border:1px solid #e5e5e5;border-radius:8px;padding:9px;min-width:0}

.name{font-size:13px;font-weight:600;min-height:32px;overflow-wrap:anywhere}

.prices{display:grid;grid-template-columns:1fr 1fr;gap:7px}

.label{font-size:11px;color:#777;margin-bottom:5px}

.price{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums}

.dec{font-size:12px;color:#777;margin-top:3px}

.muted{color:#999;font-weight:400}

.foot{margin-top:10px}

@media(max-width:360px){.match{padding:9px}.outcome{padding:7px}.price{font-size:15px}}

</style>

</head>

<body>

<main>

<header>

  <div class="brand">CRYSTAL EDGE</div>

  <div class="status"><span id="dot" class="dot"></span><span id="ws">Disconnected</span></div>

</header>

<form id="searchForm">

  <input id="q" type="search" placeholder="Match initials: Alc vs Sin" autocomplete="off">

  <button>Search</button>

</form>

<div class="filters">

  <button class="pill active" data-sport="cricket">C</button>

  <button class="pill" data-sport="tennis">T</button>

  <button class="pill" data-sport="soccer">S</button>

  <span style="width:4px"></span>

  <button class="pill active" data-window="live">LIVE</button>

  <button class="pill" data-window="today">TODAY</button>

  <button class="pill" id="refresh">Refresh</button>

</div>

<div class="meta"><span id="count">Loading matches…</span><span id="latency">Latency: —</span></div>

<div id="message">Connecting directly to Polymarket…</div>

<section id="list"></section>

</main>

<script>

(() => {

"use strict";

const GAMMA = "https://gamma-api.polymarket.com";

const SOCKET = "wss://ws-subscriptions-clob.polymarket.com/ws/market";

const $ = id => document.getElementById(id);

const state = {

  sport:"cricket", window:"live", events:[], results:[],

  socket:null, tokens:[], books:new Map(), selected:null,

  socketGeneration:0, lastMessage:0

};

const norm = s => String(s||"").toLowerCase()

  .normalize("NFD").replace(/[\u0300-\u036f]/g,"")

  .replace(/[^a-z0-9]+/g," ").trim();

const parseArray = x => {

  if(Array.isArray(x)) return x;

  if(typeof x==="string") {

    try { const y=JSON.parse(x); return Array.isArray(y)?y:[]; }

    catch {}

  }

  return [];

};

const esc = s => String(s??"").replace(/[&<>"']/g,c=>({

  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"

}[c]));

function dateOf(e) {

  const d=Date.parse(e.startDate||e.startTime||e.gameStartTime||"");

  return Number.isFinite(d)?d:0;

}

function tagsText(e) {

  return (Array.isArray(e.tags)?e.tags:[]).map(t=>

    typeof t==="string"?t:[t.label,t.name,t.slug].filter(Boolean).join(" ")

  ).join(" ");

}

function isSport(e) {

  const s=norm([e.title,e.slug,e.description,tagsText(e)].join(" "));

  if(state.sport==="cricket")

    return /\bcricket\b|\bipl\b|\bt20\b|\bone day international\b/.test(s);

  if(state.sport==="tennis")

    return /\btennis\b|\batp\b|\bwta\b|\bwimbledon\b|\broland garros\b|\bus open\b|\baustralian open\b|\bchallenger\b/.test(s);

  return /\bsoccer\b|\bfootball\b|\bpremier league\b|\bla liga\b|\bserie a\b|\bbundesliga\b|\bchampions league\b|\beuropa league\b|\bmls\b/.test(s);

}

function isMatch(e) {

  const title=String(e.title||e.name||"");

  if(e.closed===true || e.active===false) return false;

  if(/\b(winner of|champion|outright|top scorer|ballon d'or|group winner|to qualify|relegation|bitcoin|election|nasdaq|s&p 500)\b/i.test(title)) return false;

  return /\b(vs?\.?|versus)\b/i.test(title);

}

function teams(e) {

  const title=String(e.title||e.name||"");

  const m=title.match(/^(.+?)\s+(?:vs?\.?|versus)\s+(.+?)$/i);

  return m?[m[1].trim(),m[2].trim()]:[title,""];

}

function getMainMarket(e) {

  const markets=Array.isArray(e.markets)?e.markets:[];

  const choices=[];

  for(const m of markets) {

    if(m.closed===true || m.active===false) continue;

    const outcomes=parseArray(m.outcomes);

    const ids=parseArray(m.clobTokenIds||m.clob_token_ids);

    if(outcomes.length<2||ids.length<2) continue;

    const title=norm(m.question||m.groupItemTitle||"");

    if(/over under|total |spread|handicap|corners|cards|top scorer|player prop/.test(title)) continue;

    choices.push({m,outcomes,ids});

  }

  choices.sort((a,b)=>{

    const score=x=>/moneyline|match winner|to win|winner/.test(norm(x.m.question))?3:0;

    return score(b)-score(a);

  });

  return choices[0]||null;

}

function liveNow(e) {

  if(e.live===true||e.isLive===true) return true;

  const start=dateOf(e);

  const end=Date.parse(e.endDate||e.endTime||"")||0;

  const now=Date.now();

  return start>0&&start<=now&&(!end||end>=now)&&e.closed!==true;

}

function initialsMatch(query,title) {

  const q=norm(query), t=norm(title);

  if(!q) return true;

  if(t.includes(q)) return true;

  const split=q.split(/\s+(?:vs?|versus)\s+/);

  const teamsList=teams({title});

  if(split.length===2) {

    const a=norm(teamsList[0]), b=norm(teamsList[1]);

    const prefix=(needle,hay)=>{

      if(!needle||!hay) return false;

      if(hay.includes(needle)) return true;

      return hay.split(" ").some(w=>w.startsWith(needle));

    };

    return (prefix(split[0],a)&&prefix(split[1],b)) ||

           (prefix(split[0],b)&&prefix(split[1],a));

  }

  // Initials like "c s" match the first letters of words in a name.

  const words=q.split(" ");

  if(words.length===1 && q.length<=5) {

    return t.split(" ").some(w=>w.startsWith(q));

  }

  return words.every(w=>t.includes(w)||t.split(" ").some(x=>x.startsWith(w)));

}

async function loadEvents() {

  $("message").textContent="Loading match list…";

  $("count").textContent="Loading…";

  const pages=await Promise.all([0,100,200,300,400].map(async offset=>{

    const u=new URL(GAMMA+"/events");

    u.searchParams.set("active","true");

    u.searchParams.set("closed","false");

    u.searchParams.set("limit","100");

    u.searchParams.set("offset",String(offset));

    u.searchParams.set("order","startDate");

    u.searchParams.set("ascending","true");

    const r=await fetch(u,{cache:"no-store"});

    if(!r.ok) throw new Error("Gamma API HTTP "+r.status);

    return r.json();

  }));

  const seen=new Map();

  for(const page of pages) if(Array.isArray(page))

    for(const e of page) if(e.id) seen.set(String(e.id),e);

  state.events=[...seen.values()];

  renderMatches();

}

function filteredEvents() {

  const now=Date.now();

  const start=new Date(); start.setHours(0,0,0,0);

  const end=new Date(start); end.setDate(end.getDate()+1);

  const q=$("q").value.trim();

  return state.events.filter(e=>{

    if(!isSport(e)||!isMatch(e)) return false;

    const d=dateOf(e), live=liveNow(e);

    if(state.window==="live"&&!live) return false;

    if(state.window==="today"&&!live&&!(d>=start.getTime()&&d<end.getTime())) return false;

    if(!initialsMatch(q,e.title||e.name)) return false;

    return !!getMainMarket(e);

  }).sort((a,b)=>{

    const al=liveNow(a),bl=liveNow(b);

    if(al!==bl) return al?-1:1;

    return dateOf(a)-dateOf(b);

  });

}

function renderMatches() {

  state.results=filteredEvents();

  $("count").textContent=state.results.length+" matches";

  $("list").innerHTML="";

  if(!state.results.length) {

    $("message").textContent=$("q").value.trim()

      ?"No match found. Try shorter initials, e.g. 'Alc vs Sin'."

      :"No matches found for this filter. Try TODAY or refresh.";

    return;

  }

  $("message").textContent="";

  $("list").innerHTML=state.results.slice(0,60).map((e,i)=>{

    const market=getMainMarket(e);

    const outs=market?market.outcomes:["A","B"];

    const ids=market?market.ids:["",""];

    return `<article class="match" data-index="${i}">

      <div class="matchhead">

        <div><div class="title">${esc(e.title||e.name)}</div>

        <div class="sub">${liveNow(e)?"LIVE":"TODAY"}${dateOf(e)?" · "+new Date(dateOf(e)).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):""}</div></div>

        <div class="actions"><button class="small" data-select="${i}">Select</button>

        ${e.slug?`<button class="small" data-market="${i}">Market ↗</button>`:""}</div>

      </div>

      <div class="outcomes">${[0,1].map(j=>`<div class="outcome" data-token="${esc(ids[j]||"")}">

        <div class="name">${esc(outs[j]||("Outcome "+(j+1)))}</div>

        <div class="prices">

          <div><div class="label">BUY · ASK</div><div class="price muted" data-price="ask">—</div><div class="dec" data-dec="ask">Decimal —</div></div>

          <div><div class="label">SELL · BID</div><div class="price muted" data-price="bid">—</div><div class="dec" data-dec="bid">Decimal —</div></div>

        </div>

      </div>`).join("")}</div>

      <div class="foot"><span data-status>Not selected</span><span data-updated>—</span></div>

    </article>`;

  }).join("");

  document.querySelectorAll("[data-select]").forEach(b=>b.onclick=()=>selectMatch(+b.dataset.select));

  document.querySelectorAll("[data-market]").forEach(b=>b.onclick=()=>{

    const e=state.results[+b.dataset.market];

    if(e?.slug) window.open("https://polymarket.com/event/"+encodeURIComponent(e.slug),"_blank");

  });

  selectMatch(0);

}

function setStatus(connected,label) {

  $("dot").classList.toggle("on",connected);

  $("ws").textContent=label;

}

function closeSocket() {

  state.socketGeneration++;

  if(state.socket) {

    try { state.socket.close(); } catch {}

  }

  state.socket=null;

  state.tokens=[];

  state.books.clear();

  setStatus(false,"Disconnected");

}

function selectMatch(i) {

  const e=state.results[i];

  if(!e) return;

  const main=getMainMarket(e);

  if(!main) return;

  closeSocket();

  state.selected=i;

  state.tokens=[...new Set(main.ids.slice(0,2).map(String))];

  const card=document.querySelector(`.match[data-index="${i}"]`);

  document.querySelectorAll(".match").forEach(x=>x.style.borderColor="#ddd");

  if(card) {

    card.style.borderColor="#777";

    card.querySelector("[data-status]").textContent="Connecting…";

  }

  connectSocket(i,state.socketGeneration);

}

function connectSocket(i,generation) {

  setStatus(false,"Connecting");

  let ws;

  try { ws=new WebSocket(SOCKET); }

  catch { setStatus(false,"WebSocket unavailable"); return; }

  state.socket=ws;

  ws.onopen=()=>{

    if(generation!==state.socketGeneration) return;

    setStatus(true,"Connected");

    // Only subscribe to the two outcomes of the selected match.

    ws.send(JSON.stringify({type:"market",assets_ids:state.tokens}));

    const card=document.querySelector(`.match[data-index="${i}"]`);

    if(card) card.querySelector("[data-status]").textContent="Subscribed · waiting for quotes";

  };

  ws.onmessage=ev=>{

    if(generation!==state.socketGeneration) return;

    state.lastMessage=performance.now();

    $("latency").textContent="Last message "+Math.round(state.lastMessage%100000)+" ms";

    let data;

    try { data=JSON.parse(ev.data); } catch { return; }

    for(const msg of (Array.isArray(data)?data:[data])) handleMessage(msg,i);

  };

  ws.onerror=()=>{if(generation===state.socketGeneration)setStatus(false,"Connection error");};

  ws.onclose=()=>{

    if(generation!==state.socketGeneration)return;

    setStatus(false,"Disconnected");

    const card=document.querySelector(`.match[data-index="${i}"]`);

    if(card)card.querySelector("[data-status]").textContent="Connection closed — select match to reconnect";

  };

}

function num(v) {

  const n=Number(v);

  return Number.isFinite(n)&&n>0?n:null;

}

function best(levels,side) {

  const values=(Array.isArray(levels)?levels:[]).map(x=>num(x.price)).filter(x=>x!==null);

  if(!values.length)return null;

  return side==="bid"?Math.max(...values):Math.min(...values);

}

function handleMessage(m,i) {

  if(!m||typeof m!=="object")return;

  const type=String(m.event_type||m.type||"").toLowerCase();

  if(type==="book") {

    const id=String(m.asset_id||"");

    if(!state.tokens.includes(id))return;

    state.books.set(id,{bid:best(m.bids,"bid"),ask:best(m.asks,"ask")});

    paint(id,i);

    return;

  }

  if(type==="price_change"&&Array.isArray(m.price_changes)) {

    for(const ch of m.price_changes) {

      const id=String(ch.asset_id||"");

      if(!state.tokens.includes(id))continue;

      const old=state.books.get(id)||{bid:null,ask:null};

      if(ch.best_bid!==undefined)old.bid=num(ch.best_bid);

      if(ch.best_ask!==undefined)old.ask=num(ch.best_ask);

      state.books.set(id,old);

      paint(id,i);

    }

    return;

  }

  if(type==="best_bid_ask") {

    const id=String(m.asset_id||"");

    if(!state.tokens.includes(id))return;

    const old=state.books.get(id)||{bid:null,ask:null};

    if(m.best_bid!==undefined)old.bid=num(m.best_bid);

    if(m.best_ask!==undefined)old.ask=num(m.best_ask);

    state.books.set(id,old);paint(id,i);

  }

}

function fmt(v) {

  return v===null||v===undefined?"—":Number(v).toFixed(3).replace(/0+$/,"").replace(/\.$/,"");

}

function paint(id,i) {

  const card=document.querySelector(`.match[data-index="${i}"]`);

  if(!card)return;

  const pane=[...card.querySelectorAll(".outcome")].find(x=>x.dataset.token===id);

  if(!pane)return;

  const book=state.books.get(id)||{bid:null,ask:null};

  for(const side of ["ask","bid"]) {

    const v=book[side];

    const p=pane.querySelector(`[data-price="${side}"]`);

    const d=pane.querySelector(`[data-dec="${side}"]`);

    p.textContent=fmt(v);p.classList.toggle("muted",v===null);

    d.textContent="Decimal "+(v!==null?(1/v).toFixed(2):"—");

  }

  card.querySelector("[data-status]").textContent="Live CLOB updates";

  card.querySelector("[data-updated]").textContent="Updated "+new Date().toLocaleTimeString();

}

document.querySelectorAll("[data-sport]").forEach(b=>b.onclick=()=>{

  state.sport=b.dataset.sport;

  document.querySelectorAll("[data-sport]").forEach(x=>x.classList.toggle("active",x===b));

  renderMatches();

});

document.querySelectorAll("[data-window]").forEach(b=>b.onclick=()=>{

  state.window=b.dataset.window;

  document.querySelectorAll("[data-window]").forEach(x=>x.classList.toggle("active",x===b));

  renderMatches();

});

$("searchForm").onsubmit=e=>{e.preventDefault();renderMatches();};

$("refresh").onclick=()=>loadEvents().catch(showError);

function showError(e) {

  $("message").textContent="Could not load Polymarket data: "+(e?.message||e)+". Check internet or browser CORS restrictions.";

  $("count").textContent="—";

  setStatus(false,"Offline");

}

loadEvents().catch(showError);

})();

</script>

</body>

</html>
