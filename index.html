<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>CRYSTAL EDGE — Polymarket Live Sports</title>

<style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --surface: #ffffff;
  --text: #171717;
  --muted: #737373;
  --line: #e5e5e5;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  font-size: 14px;
}
header {
  padding: 16px;
  border-bottom: 1px solid var(--line);
  background: #fff;
  position: sticky;
  top: 0;
  z-index: 5;
}
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.brand { font-size: 17px; font-weight: 750; letter-spacing: .3px; }
.subtitle { color: var(--muted); font-size: 11px; margin-top: 4px; }
button, input, select { font: inherit; }
button {
  background: #fff;
  color: var(--text);
  border: 1px solid #d4d4d4;
  border-radius: 7px;
  padding: 9px 12px;
  cursor: pointer;
}
button:active { background: #f5f5f5; }
#refresh { min-width: 82px; }
.controls {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}
input, select {
  min-width: 0;
  padding: 11px;
  background: #fff;
  border: 1px solid #d4d4d4;
  border-radius: 7px;
  color: var(--text);
}
#search { flex: 1; width: 100%; }
#sport { width: 125px; }
.statusbar {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
  color: var(--muted);
  font-size: 11px;
}
.status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #a3a3a3;
}
.dot.online { background: #404040; }
main { padding: 12px; max-width: 900px; margin: auto; }
.summary {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 12px;
  margin: 4px 2px 12px;
}
#matches { display: grid; gap: 10px; }
.match {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 13px;
  background: var(--surface);
}
.matchhead {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 13px;
}
.teams { font-size: 15px; font-weight: 650; line-height: 1.5; }
.meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
.marketlink { color: var(--text); font-size: 11px; }
.oddsgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.side {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 10px;
}
.side-title {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: .3px;
}
.quote {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.quote-label { color: var(--muted); font-size: 11px; }
.quote-value {
  font-size: 17px;
  font-weight: 650;
  margin-top: 4px;
  overflow-wrap: anywhere;
}
.liquidity { color: var(--muted); font-size: 11px; margin-top: 5px; }
.empty {
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 28px 16px;
  text-align: center;
  color: var(--muted);
  line-height: 1.7;
}
footer {
  padding: 20px 12px;
  text-align: center;
  color: var(--muted);
  font-size: 11px;
}
@media (max-width: 390px) {
  header { padding: 12px; }
  main { padding: 9px; }
  #sport { width: 105px; }
  .match { padding: 10px; }
  .quote-value { font-size: 15px; }
}
</style>
</head>

<body>
<header>
  <div class="top">
    <div>
      <div class="brand">◇ CRYSTAL EDGE</div>
      <div class="subtitle">POLYMARKET · LIVE SPORTS</div>
    </div>
    <button id="refresh" type="button">Refresh</button>
  </div>

  <div class="controls">
    <input id="search" type="search"
      placeholder="Search team / player / match..."
      autocomplete="off">
    <select id="sport" aria-label="Filter sport">
      <option value="all">All sports</option>
      <option value="cricket">Cricket</option>
      <option value="tennis">Tennis</option>
      <option value="football">Football</option>
    </select>
  </div>

  <div class="statusbar">
    <span class="status">
      <span id="dot" class="dot"></span>
      <span id="statusText">Connecting</span>
    </span>
    <span id="latency">Request: —</span>
    <span id="packetCount">Messages: 0</span>
  </div>
</header>

<main>
  <div class="summary">
    <span id="count">0 matches</span>
    <span id="updated">Waiting for data</span>
  </div>
  <div id="matches">
    <div class="empty">Connecting to your existing Worker…</div>
  </div>
</main>

<footer>
  Polymarket public data · Prices and liquidity are shown only when supplied by the Worker.
</footer>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const matchesEl = $("matches");
  const workerURL = "worker.js";

  let worker = null;
  let allMatches = [];
  let connected = false;
  let messages = 0;
  let lastRequestMs = null;
  let requestStarted = 0;
  let refreshPending = false;

  function text(value, fallback = "—") {
    if (value === null || value === undefined || value === "") {
      return fallback;
    }
    return String(value);
  }

  function first(obj, keys) {
    for (const key of keys) {
      if (obj && obj[key] !== undefined &&
          obj[key] !== null && obj[key] !== "") {
        return obj[key];
      }
    }
    return null;
  }

  function decimalOdds(value) {
    if (value === null || value === undefined || value === "") {
      return null;
    }
    const n = Number(value);
    if (!Number.isFinite(n) || n <= 0) return null;

    // Convert a probability/price in (0,1] to decimal odds.
    // Values above 1 are treated as decimal odds already.
    const odds = n <= 1 ? 1 / n : n;
    return Number.isFinite(odds) ? odds.toFixed(2) : null;
  }

  function setStatus(label, isConnected) {
    connected = isConnected;
    $("statusText").textContent = label;
    $("dot").classList.toggle("online", isConnected);
  }

  function normaliseSport(match) {
    const value = text(first(match, ["sport", "category", "sportName"]), "")
      .toLowerCase();

    if (/cricket/.test(value)) return "cricket";
    if (/tennis/.test(value)) return "tennis";
    if (/football|soccer/.test(value)) return "football";

    const title = [
      match.home, match.away, match.name, match.title, match.question
    ].filter(Boolean).join(" ").toLowerCase();

    if (/cricket|ipl|t20|odi|test match/.test(title)) return "cricket";
    if (/tennis|atp|wta|grand slam/.test(title)) return "tennis";
    if (/football|soccer|premier league|la liga|champions league/.test(title)) {
      return "football";
    }
    return value || "other";
  }

  function getSides(m) {
    const home = text(first(m, ["home", "homeTeam", "team1", "player1"]), "");
    const away = text(first(m, ["away", "awayTeam", "team2", "player2"]), "");

    if (home && away) return { home, away };

    const title = text(first(m, ["name", "title", "question"]), "Unnamed match");
    const parts = title.split(/\s+(?:vs?\.?|versus)\s+/i);
    if (parts.length >= 2) {
      return { home: parts[0].trim(), away: parts.slice(1).join(" vs ").trim() };
    }
    return { home: title, away: "" };
  }

  function quoteFor(m, side, type) {
    const prefix = side === "home" ? "home" : "away";
    const capital = side === "home" ? "Home" : "Away";
    const isBack = type === "back";

    const keys = isBack
      ? [
          prefix + "BackOdds", prefix + "Back", prefix + "BuyOdds",
          prefix + "Buy", capital + "BackOdds"
        ]
      : [
          prefix + "LayOdds", prefix + "Lay", prefix + "SellOdds",
          prefix + "Sell", capital + "LayOdds"
        ];

    let raw = first(m, keys);

    // Legacy Worker compatibility: homeOdds/awayOdds are displayed as
    // the available quote only. Never invent the opposite-side quote.
    if (raw == null && isBack) {
      raw = first(m, [prefix + "Odds", capital + "Odds"]);
    }

    return decimalOdds(raw);
  }

  function liquidityFor(m, side, type) {
    const prefix = side === "home" ? "home" : "away";
    const capital = side === "home" ? "Home" : "Away";
    const keys = type === "back"
      ? [
          prefix + "BackGBP", prefix + "BackLiquidityGBP",
          prefix + "BackSizeGBP", prefix + "BackAmountGBP",
          capital + "BackGBP"
        ]
      : [
          prefix + "LayGBP", prefix + "LayLiquidityGBP",
          prefix + "LaySizeGBP", prefix + "LayAmountGBP",
          capital + "LayGBP"
        ];

    const value = first(m, keys);
    if (value == null) return null;

    const n = Number(value);
    if (!Number.isFinite(n) || n < 0) return null;

    return "£" + n.toLocaleString("en-GB", {
      minimumFractionDigits: 0,
      maximumFractionDigits: 2
    });
  }

  function make(tag, className, content) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (content !== undefined) el.textContent = content;
    return el;
  }

  function renderQuote(sideName, side, m) {
    const box = make("section", "side");
    box.appendChild(make("div", "side-title", sideName));

    const grid = make("div", "quote");

    for (const type of ["back", "lay"]) {
      const cell = make("div");
      cell.appendChild(make("div", "quote-label", type.toUpperCase()));

      const odds = quoteFor(m, side, type);
      cell.appendChild(make("div", "quote-value", odds ?? "—"));

      const liquidity = liquidityFor(m, side, type);
      cell.appendChild(make(
        "div", "liquidity", liquidity ?? "Liquidity —"
      ));
      grid.appendChild(cell);
    }

    box.appendChild(grid);
    return box;
  }

  function renderCard(m) {
    const card = make("article", "match");
    const head = make("div", "matchhead");
    const names = getSides(m);

    const info = make("div");
    info.appendChild(make("div", "teams",
      names.away ? names.home + " vs " + names.away : names.home
    ));
    info.appendChild(make("div", "meta",
      normaliseSport(m).toUpperCase()
    ));
    head.appendChild(info);

    const url = first(m, ["url", "eventUrl", "marketUrl", "link"]);
    if (typeof url === "string" && /^https:\/\/(www\.)?polymarket\.com\//i.test(url)) {
      const link = make("a", "marketlink", "Open market");
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      head.appendChild(link);
    }

    card.appendChild(head);

    const grid = make("div", "oddsgrid");
    grid.appendChild(renderQuote(names.home || "Team 1", "home", m));
    grid.appendChild(renderQuote(names.away || "Team 2", "away", m));
    card.appendChild(grid);

    return card;
  }

  function render() {
    const term = $("search").value.trim().toLowerCase();
    const sport = $("sport").value;

    const filtered = allMatches.filter(m => {
      const names = getSides(m);
      const haystack = [
        names.home, names.away, m.name, m.title, m.question, m.sport
      ].filter(Boolean).join(" ").toLowerCase();

      return (!term || haystack.includes(term)) &&
        (sport === "all" || normaliseSport(m) === sport);
    });

    matchesEl.replaceChildren();
    $("count").textContent = filtered.length + " matches";

    if (!filtered.length) {
      matchesEl.appendChild(make(
        "div", "empty",
        allMatches.length
          ? "No matches for this search or sport filter."
          : "No matches received yet. Check the Worker response."
      ));
      return;
    }

    const fragment = document.createDocumentFragment();
    filtered.forEach(m => fragment.appendChild(renderCard(m)));
    matchesEl.appendChild(fragment);
  }

  function extractMatches(msg) {
    if (Array.isArray(msg.matches)) return msg.matches;
    if (Array.isArray(msg.data)) return msg.data;
    if (Array.isArray(msg.events)) return msg.events;
    if (Array.isArray(msg.results)) return msg.results;
    return null;
  }

  function handleMessage(msg) {
    if (!msg || typeof msg !== "object") return;

    if (msg.type === "conn") {
      setStatus(msg.connected ? "Connected" : "Disconnected", !!msg.connected);
      return;
    }

    if (msg.type === "stats") {
      if (typeof msg.latency === "number") {
        lastRequestMs = msg.latency;
        $("latency").textContent = "Request: " + lastRequestMs + " ms";
      }
      if (typeof msg.packets === "number") {
        messages = msg.packets;
        $("packetCount").textContent = "Messages: " + messages;
      }
      return;
    }

    const data = extractMatches(msg);
    if (data) {
      allMatches = data;
      refreshPending = false;

      if (typeof msg.latency === "number") {
        lastRequestMs = msg.latency;
        $("latency").textContent = "Request: " + lastRequestMs + " ms";
      } else if (requestStarted) {
        lastRequestMs = Date.now() - requestStarted;
        $("latency").textContent = "Request: " + lastRequestMs + " ms";
      }

      $("updated").textContent = "Updated " +
        new Date().toLocaleTimeString();

      setStatus(connected ? "Connected" : "Data received", true);
      render();
    }

    if (msg.type === "error" || msg.error) {
      refreshPending = false;
      setStatus("Worker error", false);
      $("updated").textContent = text(msg.error || msg.message, "Request failed");
    }
  }

  function startWorker() {
    try {
      worker = new Worker(workerURL);

      worker.onmessage = event => {
        handleMessage(event.data);
      };

      worker.onerror = () => {
        setStatus("Worker error", false);
        $("updated").textContent = "Could not run worker.js";
      };

      setStatus("Connecting", false);
      requestRefresh();
    } catch (error) {
      setStatus("Worker unavailable", false);
      $("updated").textContent = "worker.js could not be started";
    }
  }

  function requestRefresh() {
    if (!worker || refreshPending) return;
    refreshPending = true;
    requestStarted = Date.now();
    $("refresh").textContent = "Loading…";

    try {
      worker.postMessage({ cmd: "fetch" });
      setTimeout(() => {
        if (refreshPending) {
          refreshPending = false;
          $("refresh").textContent = "Refresh";
          $("updated").textContent = "No response yet; check worker.js";
        }
      }, 12000);
    } catch (error) {
      refreshPending = false;
      setStatus("Request failed", false);
    }

    setTimeout(() => {
      $("refresh").textContent = "Refresh";
    }, 500);
  }

  $("refresh").addEventListener("click", requestRefresh);
  $("search").addEventListener("input", render);
  $("sport").addEventListener("change", render);

  startWorker();
})();
</script>
</body>
</html>
