

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#ffffff">

<title>CRYSTAL EDGE</title>

<style>

:root {

  color-scheme: light;

  --ink: #111111;

  --muted: #737373;

  --line: #e5e5e5;

  --soft: #f7f7f7;

  --green: #16803c;

  --red: #b42318;

}

* { box-sizing: border-box; }

body {

  margin: 0;

  background: #fff;

  color: var(--ink);

  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;

}

button, input { font: inherit; }

button { cursor: pointer; -webkit-tap-highlight-color: transparent; }

header {

  position: sticky;

  top: 0;

  z-index: 5;

  background: rgba(255,255,255,.97);

  border-bottom: 1px solid var(--line);

  padding: 12px;

}

.top, .row, .toolbar, .stats, .filters, .price-row {

  display: flex;

  align-items: center;

  gap: 8px;

}

.top { justify-content: space-between; }

.brand { font-size: 18px; font-weight: 800; letter-spacing: .4px; }

#refresh {

  border: 1px solid var(--line);

  background: white;

  border-radius: 9px;

  padding: 8px 11px;

}

.status-line {

  display: flex;

  align-items: center;

  gap: 7px;

  flex-wrap: wrap;

  color: var(--muted);

  font-size: 11px;

  margin-top: 10px;

}

.dot {

  width: 7px; height: 7px; border-radius: 50%;

  background: #999; flex: 0 0 auto;

}

.dot.ok { background: var(--green); }

.dot.bad { background: var(--red); }

.toolbar { margin-top: 12px; }

#search {

  width: 100%;

  min-width: 0;

  border: 1px solid var(--line);

  border-radius: 9px;

  padding: 10px 11px;

  background: white;

  outline: none;

}

#search:focus { border-color: #999; }

.filters {

  margin-top: 10px;

  flex-wrap: wrap;

}

.pill {

  border: 1px solid var(--line);

  color: #333;

  background: white;

  border-radius: 9px;

  min-height: 37px;

  min-width: 42px;

  padding: 7px 12px;

  transition: background .12s ease, border-color .12s ease;

}

.pill.active {

  background: #f0f0f0;

  border-color: #222;

  color: #111;

  font-weight: 700;

}

.sport { font-size: 20px; padding: 5px 11px; }

main { max-width: 820px; margin: 0 auto; padding: 10px 12px 40px; }

#progress {

  color: var(--muted);

  font-size: 12px;

  padding: 9px 2px;

}

#matches { display: grid; gap: 9px; }

.card {

  border: 1px solid var(--line);

  border-radius: 11px;

  padding: 12px;

  background: #fff;

}

.card-head {

  display: flex;

  justify-content: space-between;

  align-items: flex-start;

  gap: 10px;

}

.match-title { font-weight: 700; font-size: 14px; overflow-wrap: anywhere; }

.meta { color: var(--muted); font-size: 11px; margin-top: 4px; }

.match-state {

  flex: 0 0 auto;

  font-size: 10px;

  font-weight: 700;

  border: 1px solid var(--line);

  padding: 3px 6px;

  border-radius: 6px;

}

.match-state.live { color: var(--green); border-color: #cce8d4; }

.outcome {

  border-top: 1px solid #eee;

  padding-top: 10px;

  margin-top: 10px;

}

.outcome-name { font-weight: 650; margin-bottom: 7px; overflow-wrap: anywhere; }

.price-row { justify-content: space-between; align-items: stretch; }

.price-box { flex: 1; min-width: 0; background: #fafafa; border-radius: 8px; padding: 8px; }

.price-label { color: var(--muted); font-size: 10px; }

.price { font-size: 18px; font-weight: 750; margin-top: 2px; font-variant-numeric: tabular-nums; }

.decimal { color: #555; font-size: 12px; font-variant-numeric: tabular-nums; }

.card-foot {

  display: flex; justify-content: space-between; align-items: center;

  gap: 8px; margin-top: 10px; color: var(--muted); font-size: 10px;

}

.card-foot a { color: #333; text-decoration: underline; }

#empty {

  display: none; text-align: center; padding: 38px 12px;

  color: var(--muted); line-height: 1.6;

}

@media (max-width: 420px) {

  .brand { font-size: 16px; }

  header { padding: 10px; }

  main { padding: 9px 9px 30px; }

  .card { padding: 10px; }

  .price { font-size: 17px; }

  .stats { gap: 7px; }

}

@media (prefers-reduced-motion: reduce) {

  .pill { transition: none; }

}

</style>

</head>

<body>

<header>

  <div class="top">

    <div class="brand">◇ CRYSTAL EDGE</div>

    <button id="refresh" type="button" aria-label="Reload matches">↻ Refresh</button>

  </div>

  <div class="status-line">

    <span class="dot" id="wsDot"></span>

    <strong id="wsStatus">CONNECTING</strong>

    <span>·</span><span id="msgCount">0 messages</span>

    <span>·</span><span id="msgRate">0.0/s</span>

    <span>·</span><span id="msgPerMs">0.000/ms</span>

  </div>

  <div class="status-line stats">

    <span id="apiTime">API —</span>

    <span>·</span><span id="uiTime">UI —</span>

    <span>·</span><span id="lastAge">Last update —</span>

    <span>·</span><span id="reconnects">Reconnects 0</span>

  </div>

  <div class="toolbar">

    <input id="search" type="search" placeholder="Search team / player / match…" autocomplete="off">

  </div>

  <div class="filters" id="sports">

    <button class="pill sport active" data-sport="all" aria-label="All sports" title="All sports">◇</button>

    <button class="pill sport" data-sport="cricket" aria-label="Cricket" title="Cricket">🏏</button>

    <button class="pill sport" data-sport="tennis" aria-label="Tennis" title="Tennis">🎾</button>

    <button class="pill sport" data-sport="football" aria-label="Football" title="Football">⚽</button>

  </div>

  <div class="filters" id="periods">

    <button class="pill" data-period="live">LIVE</button>

    <button class="pill active" data-period="today">TODAY</button>

  </div>

</header>

<main>

  <div id="progress">Preparing live feed…</div>

  <div id="matches"></div>

  <div id="empty">No matching markets loaded yet.<br>Feed scanning continues automatically.</div>

</main>

<script>

"use strict";

// Keep this URL identical to the deployed Cloudflare Worker.

const API = "https://crystal-live-odds.mbeta3996.workers.dev";

const CLOB_WS = "wss://ws-subscriptions-clob.polymarket.com/ws/market";

const $ = id => document.getElementById(id);

const matchesEl = $("matches");

const emptyEl = $("empty");

const allMatches = new Map();

const tokenToMatch = new Map();

const books = new Map();

const subscribed = new Set();

let chosenSport = "all";

let chosenPeriod = "today";

let searchText = "";

let ws = null;

let pingTimer = null;

let reconnectTimer = null;

let reconnectCount = 0;

let reconnectDelay = 1000;

let totalMessages = 0;

let lastMessageAt = 0;

let lastUiMs = 0;

let renderQueued = false;

let scanRunning = false;

let scanOffset = 0;

let scanFinished = false;

let lastRateAt = Date.now();

let rateBase = 0;

let messagesPerSecond = 0;

function escapeHTML(value) {

  return String(value ?? "").replace(/[&<>"']/g, ch => ({

    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"

  })[ch]);

}

function setWsStatus(status) {

  $("wsStatus").textContent = status;

  $("wsDot").className = "dot" +

    (status === "CONNECTED" ? " ok" :

     status === "DISCONNECTED" ? " bad" : "");

}

function formatAge(ms) {

  if (!Number.isFinite(ms) || ms < 0) return "—";

  if (ms < 1000) return `${Math.round(ms)}ms`;

  return `${(ms / 1000).toFixed(1)}s`;

}

function priceText(price) {

  if (!Number.isFinite(price) || price <= 0 || price >= 1) return "—";

  return `${Math.round(price * 100)}¢`;

}

function decimalText(price) {

  if (!Number.isFinite(price) || price <= 0 || price >= 1) return "—";

  return (1 / price).toFixed(2);

}

function getPrice(tokenId) {

  return books.get(tokenId) || { bid: null, ask: null, updatedAt: 0 };

}

function visibleMatches() {

  const q = searchText.toLowerCase();

  return [...allMatches.values()].filter(m => {

    if (chosenSport !== "all" && m.sport !== chosenSport) return false;

    if (chosenPeriod === "live" && !m.live) return false;

    if (chosenPeriod === "today" && !m.today) return false;

    if (q && !`${m.title} ${m.originalTitle}`.toLowerCase().includes(q)) return false;

    return true;

  }).sort((a, b) => {

    if (a.live !== b.live) return a.live ? -1 : 1;

    return String(a.title).localeCompare(String(b.title));

  });

}

function renderCard(m) {

  const tokenRows = m.tokens.map(t => {

    const p = getPrice(t.tokenId);

    const buy = p.ask;

    const sell = p.bid;

    return `

      <div class="outcome">

        <div class="outcome-name">${escapeHTML(t.name)}</div>

        <div class="price-row">

          <div class="price-box">

            <div class="price-label">BUY · ASK</div>

            <div class="price">${priceText(buy)}</div>

            <div class="decimal">${decimalText(buy)} decimal</div>

          </div>

          <div class="price-box">

            <div class="price-label">SELL · BID</div>

            <div class="price">${priceText(sell)}</div>

            <div class="decimal">${decimalText(sell)} decimal</div>

          </div>

        </div>

      </div>`;

  }).join("");

  const marketAge = Math.max(0, Date.now() - (m.lastPriceAt || 0));

  const ageLabel = m.lastPriceAt ? `Quote ${formatAge(marketAge)} ago` : "Waiting for quote";

  const state = m.live

    ? '<span class="match-state live">LIVE</span>'

    : '<span class="match-state">TODAY</span>';

  const link = m.url

    ? `<a href="${escapeHTML(m.url)}" target="_blank" rel="noopener noreferrer">Polymarket ↗</a>`

    : "";

  return `

    <article class="card" data-id="${escapeHTML(m.id)}">

      <div class="card-head">

        <div>

          <div class="match-title">${escapeHTML(m.title)}</div>

          <div class="meta">${escapeHTML(m.sportSymbol)} ${escapeHTML(m.dateKey || "")}</div>

        </div>

        ${state}

      </div>

      ${tokenRows}

      <div class="card-foot">

        <span>${ageLabel}</span>${link}

      </div>

    </article>`;

}

function render() {

  const start = performance.now();

  const list = visibleMatches();

  matchesEl.innerHTML = list.map(renderCard).join("");

  emptyEl.style.display = list.length ? "none" : "block";

  lastUiMs = performance.now() - start;

  $("uiTime").textContent = `UI ${lastUiMs.toFixed(1)}ms`;

  $("progress").textContent =

    `${allMatches.size} matches · ${scanOffset.toLocaleString()} events scanned` +

    (scanFinished ? " · Scan complete" : " · Scanning available events…");

}

function scheduleRender() {

  if (renderQueued) return;

  renderQueued = true;

  requestAnimationFrame(() => {

    renderQueued = false;

    render();

  });

}

function normalizeMatch(raw) {

  const sport = raw.sport;

  const symbols = { cricket: "🏏", tennis: "🎾", football: "⚽" };

  if (!symbols[sport] || !Array.isArray(raw.tokens) || raw.tokens.length < 2) return null;

  const tokens = raw.tokens

    .filter(t => t && t.tokenId && t.name)

    .slice(0, 2)

    .map(t => ({ name: String(t.name), tokenId: String(t.tokenId) }));

  if (tokens.length < 2) return null;

  return {

    ...raw,

    id: String(raw.id || raw.marketId),

    title: String(raw.title || raw.originalTitle || "Match"),

    originalTitle: String(raw.originalTitle || raw.title || ""),

    sport,

    sportSymbol: symbols[sport],

    tokens,

    today: Boolean(raw.dateKey && raw.dateKey === raw.todayIST) ||

      Boolean(raw.dateKey && raw.dateKey === currentISTDate()),

    live: Boolean(raw.live),

    lastPriceAt: 0

  };

}

function currentISTDate() {

  return new Intl.DateTimeFormat("en-CA", {

    timeZone: "Asia/Kolkata",

    year: "numeric", month: "2-digit", day: "2-digit"

  }).format(new Date());

}

function subscribeNewTokens() {

  if (!ws || ws.readyState !== WebSocket.OPEN) return;

  const newIds = [];

  for (const tokenId of tokenToMatch.keys()) {

    if (!subscribed.has(tokenId)) {

      subscribed.add(tokenId);

      newIds.push(tokenId);

    }

  }

  // Chunk subscriptions to keep individual messages small.

  for (let i = 0; i < newIds.length; i += 100) {

    ws.send(JSON.stringify({

      assets_ids: newIds.slice(i, i + 100),

      operation: "subscribe",

      custom_feature_enabled: true

    }));

  }

}

function addMatches(rows, todayIST) {

  let changed = false;

  for (const raw of rows || []) {

    raw.todayIST = todayIST;

    const m = normalizeMatch(raw);

    if (!m) continue;

    if (allMatches.has(m.id)) continue;

    allMatches.set(m.id, m);

    for (const t of m.tokens) {

      tokenToMatch.set(t.tokenId, m.id);

    }

    changed = true;

  }

  if (changed) {

    subscribeNewTokens();

    scheduleRender();

  }

}

async function loadAllMatches(reset = false) {

  if (scanRunning) return;

  scanRunning = true;

  if (reset) {

    scanOffset = 0;

    scanFinished = false;

    allMatches.clear();

    tokenToMatch.clear();

    books.clear();

    subscribed.clear();

    scheduleRender();

  }

  try {

    while (!scanFinished) {

      const url = `${API}/matches?offset=${scanOffset}&limit=500&sport=all`;

      const start = performance.now();

      const response = await fetch(url, { cache: "no-store" });

      $("apiTime").textContent = `API ${(performance.now() - start).toFixed(0)}ms`;

      if (!response.ok) throw new Error(`Worker HTTP ${response.status}`);

      const payload = await response.json();

      if (!payload.success || !Array.isArray(payload.data)) {

        throw new Error(payload.error || "Unexpected Worker response");

      }

      addMatches(payload.data, payload.todayIST);

      scanOffset = Number(payload.nextOffset ?? (scanOffset + payload.scannedEvents));

      scanFinished = !payload.hasMore;

      if (!payload.scannedEvents) scanFinished = true;

      $("progress").textContent =

        `${allMatches.size} matches · ${scanOffset.toLocaleString()} events scanned` +

        (scanFinished ? " · Scan complete" : " · Loading more…");

      // Yield to the UI between API pages.

      await new Promise(resolve => setTimeout(resolve, 20));

    }

  } catch (error) {

    $("progress").textContent = `Loading error: ${error.message}. Tap Refresh to retry.`;

  } finally {

    scanRunning = false;

    scheduleRender();

  }

}

function bestFromBook(values, side) {

  if (!Array.isArray(values) || !values.length) return null;

  const prices = values.map(v => Number(v.price)).filter(p => Number.isFinite(p) && p > 0 && p < 1);

  if (!prices.length) return null;

  return side === "bid" ? Math.max(...prices) : Math.min(...prices);

}

function updateToken(tokenId, update) {

  if (!tokenId) return;

  const old = getPrice(tokenId);

  const next = { ...old };

  if (update.bid !== undefined && update.bid !== null && update.bid !== "") {

    const v = Number(update.bid);

    next.bid = Number.isFinite(v) && v > 0 && v < 1 ? v : null;

  }

  if (update.ask !== undefined && update.ask !== null && update.ask !== "") {

    const v = Number(update.ask);

    next.ask = Number.isFinite(v) && v > 0 && v < 1 ? v : null;

  }

  next.updatedAt = Date.now();

  books.set(tokenId, next);

  const matchId = tokenToMatch.get(tokenId);

  const match = matchId ? allMatches.get(matchId) : null;

  if (match) match.lastPriceAt = Date.now();

}

function handleWsPayload(raw) {

  if (raw === "PONG" || raw === "pong" || raw === "PING") return;

  let parsed;

  try { parsed = JSON.parse(raw); } catch { return; }

  const events = Array.isArray(parsed) ? parsed : [parsed];

  for (const msg of events) {

    const type = String(msg.event_type || msg.type || "").toLowerCase();

    if (type === "book") {

      const tokenId = String(msg.asset_id || msg.assetId || "");

      updateToken(tokenId, {

        bid: bestFromBook(msg.bids, "bid"),

        ask: bestFromBook(msg.asks, "ask")

      });

    } else if (type === "best_bid_ask") {

      updateToken(String(msg.asset_id || msg.assetId || ""), {

        bid: msg.best_bid,

        ask: msg.best_ask

      });

    } else if (type === "price_change" && Array.isArray(msg.price_changes)) {

      for (const change of msg.price_changes) {

        updateToken(String(change.asset_id || change.assetId || ""), {

          bid: change.best_bid,

          ask: change.best_ask

        });

      }

    }

  }

  scheduleRender();

}

function connectWebSocket() {

  clearTimeout(reconnectTimer);

  clearInterval(pingTimer);

  setWsStatus("CONNECTING");

  try {

    ws = new WebSocket(CLOB_WS);

  } catch {

    setWsStatus("DISCONNECTED");

    planReconnect();

    return;

  }

  ws.addEventListener("open", () => {

    reconnectDelay = 1000;

    setWsStatus("CONNECTED");

    const ids = [...tokenToMatch.keys()];

    subscribed.clear();

    for (let i = 0; i < ids.length; i += 100) {

      const batch = ids.slice(i, i + 100);

      for (const id of batch) subscribed.add(id);

      ws.send(JSON.stringify({

        type: "market",

        assets_ids: batch,

        custom_feature_enabled: true

      }));

    }

    pingTimer = setInterval(() => {

      if (ws && ws.readyState === WebSocket.OPEN) ws.send("PING");

    }, 10000);

  });

  ws.addEventListener("message", event => {

    totalMessages++;

    lastMessageAt = Date.now();

    handleWsPayload(event.data);

  });

  ws.addEventListener("error", () => {

    if (!ws || ws.readyState !== WebSocket.OPEN) setWsStatus("RECONNECTING");

  });

  ws.addEventListener("close", () => {

    clearInterval(pingTimer);

    setWsStatus("DISCONNECTED");

    planReconnect();

  });

}

function planReconnect() {

  clearTimeout(reconnectTimer);

  reconnectCount++;

  $("reconnects").textContent = `Reconnects ${reconnectCount}`;

  setWsStatus("RECONNECTING");

  reconnectTimer = setTimeout(() => {

    reconnectDelay = Math.min(reconnectDelay * 2, 15000);

    connectWebSocket();

  }, reconnectDelay);

}

$("sports").addEventListener("click", event => {

  const button = event.target.closest("[data-sport]");

  if (!button) return;

  chosenSport = button.dataset.sport;

  $("sports").querySelectorAll("[data-sport]").forEach(b =>

    b.classList.toggle("active", b === button)

  );

  scheduleRender();

});

$("periods").addEventListener("click", event => {

  const button = event.target.closest("[data-period]");

  if (!button) return;

  chosenPeriod = button.dataset.period;

  $("periods").querySelectorAll("[data-period]").forEach(b =>

    b.classList.toggle("active", b === button)

  );

  scheduleRender();

});

$("search").addEventListener("input", event => {

  searchText = event.target.value.trim();

  scheduleRender();

});

$("refresh").addEventListener("click", () => {

  loadAllMatches(true);

  if (!ws || ws.readyState > WebSocket.OPEN) connectWebSocket();

});

document.addEventListener("visibilitychange", () => {

  if (!document.hidden && (!ws || ws.readyState !== WebSocket.OPEN)) {

    connectWebSocket();

  }

});

setInterval(() => {

  const now = Date.now();

  const elapsed = Math.max(1, now - lastRateAt);

  messagesPerSecond = ((totalMessages - rateBase) * 1000) / elapsed;

  rateBase = totalMessages;

  lastRateAt = now;

  $("msgCount").textContent = `${totalMessages.toLocaleString()} messages`;

  $("msgRate").textContent = `${messagesPerSecond.toFixed(1)}/s`;

  $("msgPerMs").textContent = `${(messagesPerSecond / 1000).toFixed(3)}/ms`;

  $("lastAge").textContent = `Last update ${lastMessageAt ? formatAge(now - lastMessageAt) : "—"}`;

}, 1000);

connectWebSocket();

loadAllMatches();

</script>

</body>

</html>
