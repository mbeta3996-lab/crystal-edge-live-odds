
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>CRYSTAL EDGE — Polymarket Live Sports</title>
<style>
:root{color-scheme:light;--ink:#111;--muted:#737373;--line:#e5e5e5;--soft:#f7f7f7;--green:#16803c;--red:#b42318}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);padding:11px}
.top,.line,.filters,.price-row{display:flex;align-items:center;gap:8px}
.top{justify-content:space-between}.brand{font-size:18px;font-weight:800;letter-spacing:.3px}
#refresh{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px}
.line{flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:9px}
.dot{width:7px;height:7px;border-radius:50%;background:#999;display:inline-block}
.dot.ok{background:var(--green)}.dot.bad{background:var(--red)}
#search{width:100%;min-width:0;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#fff;outline:none}
#search:focus{border-color:#999}
.filters{margin-top:9px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:#fff;color:#333;border-radius:9px;min-height:36px;min-width:40px;padding:7px 11px}
.pill.active{background:#f0f0f0;border-color:#222;color:#111;font-weight:700}
.sport{font-size:19px;padding:4px 12px}
main{max-width:820px;margin:auto;padding:10px 11px 40px}
#progress{color:var(--muted);font-size:12px;padding:9px 2px}
#matches{display:grid;gap:9px}
.card{border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.match-title{font-weight:750;font-size:14px;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:11px;margin-top:4px}
.match-state{flex:0 0 auto;font-size:10px;font-weight:700;border:1px solid var(--line);padding:3px 6px;border-radius:6px}
.match-state.live{color:var(--green);border-color:#cce8d4}
.outcome{border-top:1px solid #eee;padding-top:10px;margin-top:10px}
.outcome-name{font-weight:650;margin-bottom:7px;overflow-wrap:anywhere}
.price-row{align-items:stretch}
.price-box{flex:1;min-width:0;background:#fafafa;border-radius:8px;padding:8px}
.price-label{color:var(--muted);font-size:10px}
.price{font-size:18px;font-weight:750;margin-top:2px;font-variant-numeric:tabular-nums}
.decimal{color:#555;font-size:12px;font-variant-numeric:tabular-nums}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;color:var(--muted);font-size:10px}
.card-foot a{color:#333;text-decoration:underline}
#empty{display:none;text-align:center;padding:32px 12px;color:var(--muted);line-height:1.6}
@media(max-width:420px){.brand{font-size:16px}header{padding:9px}main{padding:8px 8px 30px}.card{padding:10px}.price{font-size:17px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">◇ CRYSTAL EDGE</div>
    <button id="refresh" type="button" aria-label="Refresh matches">↻ Refresh</button>
  </div>

  <div class="line">
    <span class="dot" id="wsDot"></span>
    <strong id="wsStatus">CONNECTING</strong>
    <span>·</span><span id="msgCount">0 messages</span>
    <span>·</span><span id="msgRate">0.0/s</span>
  </div>
  <div class="line">
    <span id="apiTime">API —</span><span>·</span>
    <span id="uiTime">UI —</span><span>·</span>
    <span id="lastAge">Last update —</span><span>·</span>
    <span id="reconnects">Reconnects 0</span>
  </div>

  <div style="margin-top:11px">
    <input id="search" type="search" placeholder="Search team, player or match…" autocomplete="off">
  </div>

  <div class="filters" id="sports">
    <button class="pill sport active" data-sport="all" title="All sports" aria-label="All sports">◇</button>
    <button class="pill sport" data-sport="cricket" title="Cricket" aria-label="Cricket">🏏</button>
    <button class="pill sport" data-sport="tennis" title="Tennis" aria-label="Tennis">🎾</button>
    <button class="pill sport" data-sport="football" title="Football" aria-label="Football">⚽</button>
  </div>

  <div class="filters" id="periods">
    <button class="pill" data-period="live">LIVE</button>
    <button class="pill active" data-period="today">TODAY</button>
  </div>
</header>

<main>
  <div id="progress">Loading Polymarket matches…</div>
  <div id="matches"></div>
  <div id="empty">No eligible matches found yet.<br>The Worker may have more pages to scan, or its filters may have rejected the available events.</div>
</main>

<script>
"use strict";

// Cloudflare Worker already deployed by you.
const API = "https://crystal-live-odds.mbeta3996.workers.dev";

// Direct Polymarket CLOB WebSocket; no extra Worker relay hop.
const CLOB_WS = "wss://ws-subscriptions-clob.polymarket.com/ws/market";

const $ = id => document.getElementById(id);
const matchesEl = $("matches");
const emptyEl = $("empty");

const allMatches = new Map();
const tokenToMatch = new Map();
const books = new Map();
const subscribed = new Set();

let chosenSport = "all";
let chosenPeriod = "today";
let searchText = "";

let ws = null;
let pingTimer = null;
let reconnectTimer = null;
let reconnectCount = 0;
let reconnectDelay = 1000;
let subscriptionInitialized = false;

let totalMessages = 0;
let lastMessageAt = 0;
let lastUiMs = 0;
let renderQueued = false;
let scanRunning = false;
let scanOffset = 0;
let scanFinished = false;
let scanGeneration = 0;
let scanController = null;

let lastRateAt = Date.now();
let rateBase = 0;

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[ch]);
}

function currentISTDate() {
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone:"Asia/Kolkata",
    year:"numeric",month:"2-digit",day:"2-digit"
  }).formatToParts(new Date());
  const p = Object.fromEntries(parts.map(x => [x.type,x.value]));
  return `${p.year}-${p.month}-${p.day}`;
}

function setWsStatus(status) {
  $("wsStatus").textContent = status;
  $("wsDot").className = "dot" +
    (status === "CONNECTED" ? " ok" :
     status === "DISCONNECTED" ? " bad" : "");
}

function formatAge(ms) {
  if (!Number.isFinite(ms) || ms < 0) return "—";
  return ms < 1000 ? `${Math.round(ms)}ms` : `${(ms/1000).toFixed(1)}s`;
}

function priceText(price) {
  if (!Number.isFinite(price) || price <= 0 || price >= 1) return "—";
  return `${Math.round(price * 100)}¢`;
}

function decimalText(price) {
  if (!Number.isFinite(price) || price <= 0 || price >= 1) return "—";
  return (1 / price).toFixed(2);
}

function getPrice(tokenId) {
  return books.get(tokenId) || {bid:null,ask:null,updatedAt:0};
}

function visibleMatches() {
  const q = searchText.toLowerCase();

  return [...allMatches.values()].filter(m => {
    if (chosenSport !== "all" && m.sport !== chosenSport) return false;
    if (chosenPeriod === "live" && !m.live) return false;
    if (chosenPeriod === "today" && !m.today) return false;

    if (q && !`${m.title} ${m.originalTitle}`.toLowerCase().includes(q)) {
      return false;
    }
    return true;
  }).sort((a,b) => {
    if (a.live !== b.live) return a.live ? -1 : 1;
    return a.title.localeCompare(b.title);
  });
}

function renderCard(m) {
  const rows = m.tokens.map(t => {
    const p = getPrice(t.tokenId);
    return `
      <div class="outcome">
        <div class="outcome-name">${escapeHTML(t.name)}</div>
        <div class="price-row">
          <div class="price-box">
            <div class="price-label">BUY · ASK</div>
            <div class="price">${priceText(p.ask)}</div>
            <div class="decimal">${decimalText(p.ask)} decimal</div>
          </div>
          <div class="price-box">
            <div class="price-label">SELL · BID</div>
            <div class="price">${priceText(p.bid)}</div>
            <div class="decimal">${decimalText(p.bid)} decimal</div>
          </div>
        </div>
      </div>`;
  }).join("");

  const state = m.live
    ? '<span class="match-state live">LIVE</span>'
    : '<span class="match-state">TODAY</span>';

  const link = m.url
    ? `<a href="${escapeHTML(m.url)}" target="_blank" rel="noopener noreferrer">Polymarket ↗</a>`
    : "";

  const age = m.lastPriceAt
    ? `Quote ${formatAge(Date.now()-m.lastPriceAt)} ago`
    : "Waiting for quote";

  return `
    <article class="card" data-id="${escapeHTML(m.id)}">
      <div class="card-head">
        <div>
          <div class="match-title">${escapeHTML(m.title)}</div>
          <div class="meta">${escapeHTML(m.sportSymbol)} ${escapeHTML(m.dateKey || "")}</div>
        </div>
        ${state}
      </div>
      ${rows}
      <div class="card-foot"><span>${age}</span>${link}</div>
    </article>`;
}

function render() {
  const start = performance.now();
  const list = visibleMatches();

  matchesEl.innerHTML = list.map(renderCard).join("");
  emptyEl.style.display = list.length ? "none" : "block";

  lastUiMs = performance.now() - start;
  $("uiTime").textContent = `UI ${lastUiMs.toFixed(1)}ms`;
  $("progress").textContent =
    `${allMatches.size} matches · ${scanOffset.toLocaleString()} events scanned` +
    (scanFinished ? " · Scan complete" : " · Scanning available events…");
}

function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    render();
  });
}

function normalizeMatch(raw) {
  const symbols = {cricket:"🏏",tennis:"🎾",football:"⚽"};
  const sport = String(raw.sport || "").toLowerCase();

  if (!symbols[sport] || !Array.isArray(raw.tokens) || raw.tokens.length < 2) {
    return null;
  }

  const tokens = raw.tokens
    .filter(t => t && t.tokenId && t.name)
    .slice(0,2)
    .map(t => ({name:String(t.name),tokenId:String(t.tokenId)}));

  if (tokens.length !== 2 || tokens[0].tokenId === tokens[1].tokenId) {
    return null;
  }

  const dateKey = String(raw.dateKey || "");
  const today = dateKey === currentISTDate();

  return {
    ...raw,
    id: `${String(raw.id || raw.marketId)}:${String(raw.marketId || "")}`,
    title: String(raw.title || raw.originalTitle || "Match"),
    originalTitle: String(raw.originalTitle || raw.title || ""),
    sport,
    sportSymbol:symbols[sport],
    tokens,
    dateKey,
    today,
    // Old-date events should already be rejected by the Worker.
    // The UI does not invent live status from the clock.
    live:Boolean(raw.live) && today,
    lastPriceAt:0
  };
}

// Subscribe only to tokens needed by the currently visible match list.
// Use one WebSocket connection for all required token IDs.
function syncTokenSubscriptions() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;

  const desired = new Set(
    visibleMatches().flatMap(m => m.tokens.map(t => t.tokenId))
  );

  if (!subscriptionInitialized) {
    if (!desired.size) return;

    const ids = [...desired];
    ws.send(JSON.stringify({
      type:"market",
      assets_ids:ids,
      custom_feature_enabled:true
    }));

    ids.forEach(id => subscribed.add(id));
    subscriptionInitialized = true;
    return;
  }

  const remove = [...subscribed].filter(id => !desired.has(id));
  const add = [...desired].filter(id => !subscribed.has(id));

  if (remove.length) {
    ws.send(JSON.stringify({
      assets_ids:remove,
      operation:"unsubscribe"
    }));
    remove.forEach(id => subscribed.delete(id));
  }

  if (add.length) {
    ws.send(JSON.stringify({
      assets_ids:add,
      operation:"subscribe",
      custom_feature_enabled:true
    }));
    add.forEach(id => subscribed.add(id));
  }
}

function addMatches(rows) {
  let changed = false;

  for (const raw of rows || []) {
    const m = normalizeMatch(raw);
    if (!m) continue;

    if (allMatches.has(m.id)) continue;

    allMatches.set(m.id,m);
    for (const t of m.tokens) tokenToMatch.set(t.tokenId,m.id);
    changed = true;
  }

  if (changed) {
    scheduleRender();
    syncTokenSubscriptions();
  }
}

// Each Worker request scans up to 500 events. Continue using nextOffset
// while hasMore is true, including when a page has zero eligible matches.
async function loadAllMatches() {
  const generation = ++scanGeneration;

  if (scanController) scanController.abort();
  scanController = new AbortController();

  scanRunning = true;
  scanOffset = 0;
  scanFinished = false;

  allMatches.clear();
  tokenToMatch.clear();
  books.clear();

  scheduleRender();
  syncTokenSubscriptions();

  try {
    while (generation === scanGeneration && !scanFinished) {
      const url = `${API}/matches?offset=${scanOffset}&sport=all&debug=0`;
      const start = performance.now();

      const response = await fetch(url, {
        cache:"no-store",
        signal:scanController.signal
      });

      $("apiTime").textContent = `API ${(performance.now()-start).toFixed(0)}ms`;

      if (!response.ok) throw new Error(`Worker HTTP ${response.status}`);

      const payload = await response.json();

      if (generation !== scanGeneration) return;

      if (!payload.success || !Array.isArray(payload.data)) {
        throw new Error(payload.error || "Unexpected Worker response");
      }

      addMatches(payload.data);

      const previousOffset = scanOffset;
      const scanned = Number(payload.scannedEvents || 0);
      scanOffset = Number(payload.nextOffset ?? (scanOffset + scanned));

      scanFinished = !payload.hasMore || scanned === 0 || scanOffset <= previousOffset;

      $("progress").textContent =
        `${allMatches.size} matches · ${scanOffset.toLocaleString()} events scanned` +
        (scanFinished ? " · Scan complete" : " · Loading next page…");

      // Yield so Safari can paint and process WebSocket messages between pages.
      if (!scanFinished) await new Promise(resolve => setTimeout(resolve, 15));
    }
  } catch (error) {
    if (error.name !== "AbortError" && generation === scanGeneration) {
      $("progress").textContent = `Loading error: ${error.message}. Tap Refresh to retry.`;
    }
  } finally {
    if (generation === scanGeneration) {
      scanRunning = false;
      scanController = null;
      scanFinished = true;
      scheduleRender();
      syncTokenSubscriptions();
    }
  }
}

function bestFromBook(values, side) {
  if (!Array.isArray(values) || !values.length) return null;

  const prices = values.map(v => Number(v.price))
    .filter(p => Number.isFinite(p) && p > 0 && p < 1);

  if (!prices.length) return null;
  return side === "bid" ? Math.max(...prices) : Math.min(...prices);
}

function updateToken(tokenId, update) {
  if (!tokenId || !tokenToMatch.has(tokenId)) return;

  const old = getPrice(tokenId);
  const next = {...old};
  let changed = false;

  for (const side of ["bid","ask"]) {
    if (update[side] === undefined || update[side] === null || update[side] === "") {
      continue;
    }

    const value = Number(update[side]);
    const valid = Number.isFinite(value) && value > 0 && value < 1;
    const price = valid ? value : null;

    if (next[side] !== price) changed = true;
    next[side] = price;
  }

  if (!changed) return;

  next.updatedAt = Date.now();
  books.set(tokenId,next);

  const match = allMatches.get(tokenToMatch.get(tokenId));
  if (match) match.lastPriceAt = Date.now();
}

function handleWsPayload(raw) {
  if (raw === "PONG" || raw === "pong" || raw === "PING") return;

  let parsed;
  try { parsed = JSON.parse(raw); } catch { return; }

  const events = Array.isArray(parsed) ? parsed : [parsed];

  for (const msg of events) {
    const type = String(msg.event_type || msg.type || "").toLowerCase();

    if (type === "book") {
      updateToken(String(msg.asset_id || msg.assetId || ""), {
        bid:bestFromBook(msg.bids,"bid"),
        ask:bestFromBook(msg.asks,"ask")
      });
    } else if (type === "best_bid_ask") {
      updateToken(String(msg.asset_id || msg.assetId || ""), {
        bid:msg.best_bid,
        ask:msg.best_ask
      });
    } else if (type === "price_change" && Array.isArray(msg.price_changes)) {
      for (const change of msg.price_changes) {
        updateToken(String(change.asset_id || change.assetId || ""), {
          bid:change.best_bid,
          ask:change.best_ask
        });
      }
    }
  }

  scheduleRender();
}

function connectWebSocket() {
  clearTimeout(reconnectTimer);
  clearInterval(pingTimer);

  if (ws && ws.readyState < WebSocket.CLOSING) {
    try { ws.close(); } catch {}
  }

  ws = null;
  subscriptionInitialized = false;
  subscribed.clear();

  setWsStatus("CONNECTING");

  try {
    ws = new WebSocket(CLOB_WS);
  } catch {
    setWsStatus("DISCONNECTED");
    planReconnect();
    return;
  }

  const socket = ws;

  socket.addEventListener("open", () => {
    if (ws !== socket) return;

    reconnectDelay = 1000;
    setWsStatus("CONNECTED");

    // Wait for valid token IDs if the match scan hasn't found any yet.
    syncTokenSubscriptions();

    pingTimer = setInterval(() => {
      if (ws === socket && socket.readyState === WebSocket.OPEN) {
        try { socket.send("PING"); } catch {}
      }
    },10000);
  });

  socket.addEventListener("message", event => {
    if (ws !== socket) return;

    totalMessages++;
    lastMessageAt = Date.now();
    handleWsPayload(event.data);
  });

  socket.addEventListener("error", () => {
    if (ws === socket) setWsStatus("RECONNECTING");
  });

  socket.addEventListener("close", () => {
    if (ws !== socket) return;

    clearInterval(pingTimer);
    pingTimer = null;
    subscriptionInitialized = false;
    subscribed.clear();
    ws = null;

    setWsStatus("DISCONNECTED");
    planReconnect();
  });
}

function planReconnect() {
  clearTimeout(reconnectTimer);
  reconnectCount++;
  $("reconnects").textContent = `Reconnects ${reconnectCount}`;
  setWsStatus("RECONNECTING");

  reconnectTimer = setTimeout(() => {
    reconnectDelay = Math.min(reconnectDelay * 2,15000);
    connectWebSocket();
  },reconnectDelay);
}

$("sports").addEventListener("click",event => {
  const button = event.target.closest("[data-sport]");
  if (!button) return;

  chosenSport = button.dataset.sport;
  $("sports").querySelectorAll("[data-sport]").forEach(b =>
    b.classList.toggle("active",b === button)
  );

  scheduleRender();
  syncTokenSubscriptions();
});

$("periods").addEventListener("click",event => {
  const button = event.target.closest("[data-period]");
  if (!button) return;

  chosenPeriod = button.dataset.period;
  $("periods").querySelectorAll("[data-period]").forEach(b =>
    b.classList.toggle("active",b === button)
  );

  scheduleRender();
  syncTokenSubscriptions();
});

$("search").addEventListener("input",event => {
  searchText = event.target.value.trim();
  scheduleRender();
  syncTokenSubscriptions();
});

$("refresh").addEventListener("click",() => {
  loadAllMatches();

  if (!ws || ws.readyState >= WebSocket.CLOSING) {
    connectWebSocket();
  }
});

document.addEventListener("visibilitychange",() => {
  if (!document.hidden && (!ws || ws.readyState !== WebSocket.OPEN)) {
    connectWebSocket();
  }
});

setInterval(() => {
  const now = Date.now();
  const elapsed = Math.max(1,now-lastRateAt);
  const rate = ((totalMessages-rateBase)*1000)/elapsed;

  rateBase = totalMessages;
  lastRateAt = now;

  $("msgCount").textContent = `${totalMessages.toLocaleString()} messages`;
  $("msgRate").textContent = `${rate.toFixed(1)}/s`;
  $("lastAge").textContent = `Last update ${lastMessageAt ? formatAge(now-lastMessageAt) : "—"}`;
},1000);

// Only one WebSocket is opened. It is reused as filters and tokens change.
connectWebSocket();
loadAllMatches();
</script>
</body>
</html>
