
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>CRYSTAL EDGE — Polymarket Sports</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font:14px Arial,Helvetica,sans-serif}
header{padding:15px;border-bottom:1px solid #e5e5e5;display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.3px}
.sub{font-size:12px;color:#777;margin-top:4px}
button,input{font:inherit}
button{background:#fff;border:1px solid #ddd;border-radius:7px;padding:9px 11px;color:#222}
main{max-width:850px;margin:auto;padding:12px}
.status{font-size:12px;color:#666;margin:3px 0 12px;overflow-wrap:anywhere}
.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px}
.filters button{white-space:nowrap;flex-shrink:0}
.filters button.active{background:#111;color:#fff;border-color:#111}
.search{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-bottom:12px;background:#fff;color:#111}
.summary{font-size:12px;color:#666;margin:5px 0 10px}
.card{border:1px solid #e2e2e2;border-radius:10px;padding:13px;margin-bottom:10px;background:#fff}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#666;text-transform:uppercase}
.match{font-size:16px;font-weight:700;line-height:1.35;margin:10px 0 5px;overflow-wrap:anywhere}
.question{font-size:12px;color:#777;margin-bottom:12px;overflow-wrap:anywhere}
.odds{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.odd{border:1px solid #e5e5e5;border-radius:8px;padding:10px;min-width:0}
.label{font-size:10px;color:#666;font-weight:700;letter-spacing:.4px}
.price{font-size:23px;font-weight:700;margin:5px 0}
.buy .price{color:#087b47}
.sell .price{color:#c33333}
.name{font-size:11px;color:#666;overflow-wrap:anywhere}
.bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:11px;font-size:11px;color:#777}
.bottom a,.detailLink{color:#155ac5;text-decoration:none}
.bottom button{font-size:11px;padding:6px 8px}
.empty{padding:25px 10px;text-align:center;color:#666;border:1px solid #eee;border-radius:8px}
dialog{width:calc(100% - 24px);max-width:520px;border:1px solid #ddd;border-radius:12px;background:white;color:#111;padding:16px}
dialog::backdrop{background:#0005}
.detailrow{padding:12px 0;border-bottom:1px solid #eee}
.detailrow strong{display:block;margin-bottom:6px}
.detailrow small{display:block;color:#777;margin-top:5px}
.dialoghead{display:flex;justify-content:space-between;gap:12px;align-items:center}
.dialoghead h2{font-size:17px;margin:0}
footer{text-align:center;color:#888;font-size:11px;padding:18px}
@media(max-width:380px){.brand h1{font-size:17px}.price{font-size:21px}.card{padding:10px}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>◇ CRYSTAL EDGE</h1>
    <div class="sub">POLYMARKET · LIVE SPORTS</div>
  </div>
  <button id="refresh">↻ Refresh</button>
</header>

<main>
  <div class="status" id="status">Connecting to Polymarket data…</div>

  <div class="filters" id="sports">
    <button class="active" data-sport="all">All Sports</button>
    <button data-sport="cricket">Cricket</button>
    <button data-sport="tennis">Tennis</button>
    <button data-sport="soccer">Football</button>
    <button data-sport="basketball">Basketball</button>
  </div>

  <div class="filters" id="times">
    <button class="active" data-time="all">All Matches</button>
    <button data-time="live">Live Now</button>
    <button data-time="today">Today</button>
    <button data-time="tomorrow">Tomorrow</button>
    <button data-time="upcoming">Upcoming</button>
  </div>

  <input id="search" class="search" type="search" placeholder="Search team, player or match…">
  <div class="summary" id="summary">Loading matches…</div>
  <section id="matches"><div class="empty">Loading Polymarket matches…</div></section>
</main>

<dialog id="details">
  <div class="dialoghead">
    <h2 id="detailTitle">Match markets</h2>
    <button id="closeDetails">Close</button>
  </div>
  <div id="detailBody"></div>
</dialog>
<footer>Odds from Polymarket public market data. No quote means unavailable.</footer>

<script>
'use strict';
const API='https://crystal-live-odds.mbeta3996.workers.dev';
const WS='wss://ws-subscriptions-clob.polymarket.com/ws/market';
const $=id=>document.getElementById(id);
const state={matches:[],sport:'all',time:'all',query:'',quotes:{},socket:null,ping:null,reconnect:null,loading:false};

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function number(v){if(v===null||v===undefined||v==='')return null;const n=Number(v);return Number.isFinite(n)?n:null;}
function decimal(v){const p=number(v);return p>0&&p<1?(1/p).toFixed(2):'—';}
function parseArray(v){if(Array.isArray(v))return v;if(typeof v==='string'){try{return JSON.parse(v)}catch{}}return [];}

function sportOf(m){
 const s=String(m.sport||m.sportSlug||m.category||'').toLowerCase();
 const t=String(m.title||m.name||m.question||m.eventTitle||'').toLowerCase();
 if(/cricket/.test(s+' '+t))return 'cricket';
 if(/tennis|atp |wta |challenger/.test(s+' '+t))return 'tennis';
 if(/basketball|nba /.test(s+' '+t))return 'basketball';
 if(/football|soccer|premier league|champions league/.test(s+' '+t))return 'soccer';
 return s;
}
function tokensOf(m){
 let a=parseArray(m.tokenIds||m.tokens||m.clobTokenIds||m.clob_token_ids);
 return a.map(x=>typeof x==='object'?String(x.tokenId||x.token_id||x.id||''):String(x)).filter(Boolean);
}
function dateOf(m){
 const v=m.startTime||m.startDate||m.date||m.eventStartTime||m.gameStartTime;
 if(!v)return null;const d=new Date(v);return Number.isNaN(d.getTime())?null:d;
}
function normalize(m,i){
 const outcomes=parseArray(m.outcomes).map(x=>typeof x==='object'?(x.name||x.title||''):String(x));
 const d=dateOf(m);
 return {...m,id:String(m.id||m.eventId||m.slug||i),title:String(m.title||m.name||m.matchName||m.eventTitle||m.question||'Sports match'),
 sport:sportOf(m),tokens:tokensOf(m),outcomes,date:d,
 live:Boolean(m.live||m.isLive||m.is_live||String(m.status||'').toLowerCase()==='live'),
 url:m.url||m.eventUrl||m.event_url||(m.slug?'https://polymarket.com/event/'+m.slug:'')};
}
function dateLabel(m){return m.date?m.date.toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'Time unavailable';}
function visible(m){
 if(!['cricket','tennis','soccer','basketball'].includes(m.sport))return false;
 if(state.sport!=='all'&&state.sport!==m.sport)return false;
 if(state.query&&!(`${m.title} ${m.question||''} ${m.outcomes.join(' ')}`).toLowerCase().includes(state.query))return false;
 const now=new Date(),d=m.date;
 if(state.time==='live')return m.live;
 if(state.time==='today')return !!d&&d.toDateString()===now.toDateString();
 if(state.time==='tomorrow'){const n=new Date();n.setDate(n.getDate()+1);return !!d&&d.toDateString()===n.toDateString();}
 if(state.time==='upcoming')return !m.live&&(!d||d>=now);
 return true;
}
function render(){
 const list=state.matches.filter(visible);
 $('summary').textContent=`${list.length} matches shown · ${state.matches.length} eligible matches`;
 if(!list.length){$('matches').innerHTML='<div class="empty">No matching markets found. Try All Matches or refresh.</div>';return;}
 $('matches').innerHTML=list.map(m=>{
  const token=m.tokens[0],q=token?(state.quotes[token]||{}):{};
  const age=q.at?Math.floor((Date.now()-q.at)/1000)+'s ago':'Waiting for quote';
  return `<article class="card">
   <div class="meta"><span>${esc(m.sport)}</span><span>${m.live?'LIVE':esc(dateLabel(m))}</span></div>
   <div class="match">${esc(m.title)}</div>
   <div class="question">${esc(m.question||'Polymarket outcome market')}</div>
   <div class="odds">
    <div class="odd buy"><div class="label">BUY · BEST ASK</div><div class="price">${decimal(q.ask)}</div><div class="name">${esc(m.outcomes[0]||'Outcome 1')}</div></div>
    <div class="odd sell"><div class="label">SELL · BEST BID</div><div class="price">${decimal(q.bid)}</div><div class="name">${esc(m.outcomes[0]||'Outcome 1')}</div></div>
   </div>
   <div class="bottom"><span>${esc(age)}</span><span>${m.url?`<a href="${esc(m.url)}" target="_blank" rel="noopener">Polymarket ↗</a> `:''}<button data-detail="${esc(m.id)}">All markets</button></span></div>
  </article>`;
 }).join('');
 $('matches').querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>showDetail(b.dataset.detail));
}
function showDetail(id){
 const m=state.matches.find(x=>x.id===id);if(!m)return;
 $('detailTitle').textContent=m.title;
 $('detailBody').innerHTML=m.tokens.map((token,i)=>{
  const q=state.quotes[token]||{};
  return `<div class="detailrow"><strong>${esc(m.outcomes[i]||'Outcome '+(i+1))}</strong><div>BUY ${decimal(q.ask)} · SELL ${decimal(q.bid)}</div><small>${q.at?'Quote received':'Quote unavailable'}</small></div>`;
 }).join('')||'<div class="empty">No outcome tokens available.</div>';
 if(m.url)$('detailBody').insertAdjacentHTML('beforeend',`<p><a class="detailLink" target="_blank" rel="noopener" href="${esc(m.url)}">Open on Polymarket ↗</a></p>`);
 $('details').showModal();
}
$('closeDetails').onclick=()=>$('details').close();
$('details').addEventListener('click',e=>{if(e.target===$('details'))$('details').close();});
$('sports').onclick=e=>{const b=e.target.closest('[data-sport]');if(!b)return;state.sport=b.dataset.sport;$('sports').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render();};
$('times').onclick=e=>{const b=e.target.closest('[data-time]');if(!b)return;state.time=b.dataset.time;$('times').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render();};
$('search').oninput=e=>{state.query=e.target.value.trim().toLowerCase();render();};

async function getJSON(url){
 const c=new AbortController(),timer=setTimeout(()=>c.abort(),12000);
 try{const r=await fetch(url,{signal:c.signal,cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return await r.json();}
 finally{clearTimeout(timer);}
}
async function loadBook(token){
 try{
  const d=await getJSON(API+'/book?token_id='+encodeURIComponent(token));
  if(!d||d.success===false)return;
  state.quotes[token]={bid:number(d.bestBid??d.bid),ask:number(d.bestAsk??d.ask),at:Date.now()};
 }catch{}
}
function quote(token,bid,ask){
 if(!token)return;
 const old=state.quotes[token]||{};
 const b=number(bid),a=number(ask);
 state.quotes[token]={
  bid:b!==null&&b>0&&b<1?b:old.bid??null,
  ask:a!==null&&a>0&&a<1?a:old.ask??null,at:Date.now()
 };
 render();
}
function message(data){
 if(typeof data==='string'){if(data==='PONG'||data==='pong')return;try{data=JSON.parse(data)}catch{return;}}
 if(Array.isArray(data)){data.forEach(message);return;}
 if(!data||typeof data!=='object')return;
 const type=String(data.event_type||data.type||'').toLowerCase();
 if(type==='book'){
  const bids=(data.bids||data.buys||[]).map(x=>number(x.price)).filter(p=>p>0&&p<1);
  const asks=(data.asks||data.sells||[]).map(x=>number(x.price)).filter(p=>p>0&&p<1);
  quote(data.asset_id||data.token_id,bids.length?Math.max(...bids):null,asks.length?Math.min(...asks):null);
 }else if(type==='best_bid_ask'){
  quote(data.asset_id||data.token_id,data.best_bid,data.best_ask);
 }else if(type==='price_change'){
  (data.price_changes||[]).forEach(x=>quote(x.asset_id||x.token_id,x.best_bid,x.best_ask));
 }else if(data.asset_id&&(data.best_bid!==undefined||data.best_ask!==undefined)){
  quote(data.asset_id,data.best_bid,data.best_ask);
 }
}
function connect(tokens){
 if(state.socket){try{state.socket.close()}catch{}}
 clearInterval(state.ping);clearTimeout(state.reconnect);
 if(!tokens.length){$('status').textContent='Worker connected · no token IDs in feed';return;}
 const ws=new WebSocket(WS);state.socket=ws;
 $('status').textContent='Connecting to Polymarket CLOB…';
 ws.onopen=()=>{
  $('status').textContent='CLOB connected · subscribed to '+tokens.length+' tokens';
  for(let i=0;i<tokens.length;i+=500)ws.send(JSON.stringify({assets_ids:tokens.slice(i,i+500),type:'market',custom_feature_enabled:true}));
  state.ping=setInterval(()=>{if(ws.readyState===WebSocket.OPEN)ws.send('PING')},10000);
 };
 ws.onmessage=e=>message(e.data);
 ws.onerror=()=>{$('status').textContent='CLOB connection issue';};
 ws.onclose=()=>{
  clearInterval(state.ping);
  if(state.socket===ws){$('status').textContent='CLOB disconnected · reconnecting…';state.reconnect=setTimeout(()=>connect([...new Set(state.matches.flatMap(m=>m.tokens))]),2500);}
 };
}
async function loadMatches(){
 if(state.loading)return;state.loading=true;$('refresh').textContent='Loading…';$('status').textContent='Fetching Polymarket events…';
 try{
  const start=performance.now();
  const d=await getJSON(API+'/matches?limit=200&offset=0&sport=all');
  const raw=Array.isArray(d)?d:(d.data||d.matches||[]);
  state.matches=raw.map(normalize).filter(m=>['cricket','tennis','soccer','basketball'].includes(m.sport)&&m.tokens.length>=2);
  render();
  const tokens=[...new Set(state.matches.flatMap(m=>m.tokens))];
  $('status').textContent=`Worker connected · ${state.matches.length} matches · ${Math.round(performance.now()-start)} ms`;
  await Promise.allSettled(tokens.slice(0,100).map(loadBook));
  render();
  connect(tokens);
 }catch(e){
  $('status').textContent='Feed error: '+e.message;
  if(!state.matches.length)$('matches').innerHTML='<div class="empty">Unable to load matches. Check the Cloudflare Worker endpoint.</div>';
 }finally{state.loading=false;$('refresh').textContent='↻ Refresh';}
}
$('refresh').onclick=loadMatches;
loadMatches();
setInterval(()=>{if(state.matches.length)render()},5000);
</script>
</body>
</html>
