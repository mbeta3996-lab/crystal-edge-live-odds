<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Odds Dashboard – Cricket, Soccer, Tennis</title>
<style>
  body {font-family:Arial,Helvetica,sans-serif; margin:0; padding:0; background:#fafafa;}
  header {background:#333; color:#fff; padding:0.8rem 1rem; text-align:center;}
  #search {margin:0.5rem 0; padding:0.4rem; width:80%; max-width:400px;}
  #refresh {margin-left:0.5rem; padding:0.4rem 0.8rem;}
  #matches {list-style:none; padding:0; margin:0;}
  #matches li {border-bottom:1px solid #ddd; padding:0.6rem 1rem;}
  #matches li span {font-weight:bold;}
</style>
</head>
<body>
<header>
  <h1>Live Odds – Cricket / Soccer / Tennis</h1>
  <input id="search" type="text" placeholder="Search team / match…">
  <button id="refresh">Refresh</button>
</header>

<ul id="matches"></ul>

<script>
/* Register the worker – it will start the socket and forward filtered odds */
if (window.Worker) {
  const worker = new Worker('worker.js');
  worker.onmessage = e => {
    // e.data = { sport, teams, odds } – already filtered
    renderMatches(e.data);
  };
  // Auto‑refresh every 30 s (you can change the interval)
  setInterval(() => worker.postMessage({cmd:'fetch'}), 30_000);
  // Manual refresh button
  document.getElementById('refresh').onclick = () => worker.postMessage({cmd:'fetch'});
  // Search bar – filters the displayed list client‑side
  const list = document.getElementById('matches');
  const searchBox = document.getElementById('search');
  searchBox.addEventListener('input', () => {
    const term = searchBox.value.trim().toLowerCase();
    const items = list.querySelectorAll('li');
    items.forEach(li => {
      const txt = li.textContent.toLowerCase();
      li.style.display = txt.includes(term) ? '' : 'none';
    });
  });
}

/* Render the odds received from the worker */
function renderMatches(data) {
  const ul = document.getElementById('matches');
  ul.innerHTML = '';                     // clear previous rows
  if (!data || !data.matches) return;
  data.matches.forEach(m => {
    const li = document.createElement('li');
    li.innerHTML = `
      <span>${m.home} vs ${m.away}</span>
      <strong>${m.sport.toUpperCase()}:</strong>
      ${m.homeOdds} / ${m.awayOdds}
    `;
    ul.appendChild(li);
  });
}
</script>
</body>
</html>
