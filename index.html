
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRYSTAL EDGE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font:14px Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid #ddd}
h1{font-size:18px;margin:0;font-weight:600}
button,input,select{font:inherit;background:white;color:#111;border:1px solid #ccc;border-radius:4px;padding:9px}
button{cursor:pointer}
main{max-width:900px;margin:auto;padding:12px}
.stats{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.stat{border:1px solid #ddd;padding:7px;font-size:12px;border-radius:4px}
.controls,.sports{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
#search{flex:1;min-width:150px}
.sports button.active{background:#eee;font-weight:bold}
.match{border:1px solid #ddd;border-radius:4px;padding:12px;margin:10px 0}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.title{font-weight:bold;font-size:15px}
.small{font-size:12px;color:#555;margin-top:5px}
.outcomes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.outcome{border:1px solid #ddd;padding:9px;min-width:0}
.outcome strong{font-size:17px}
.row{display:flex;justify-content:space-between;gap:6px;margin-top:6px;font-size:12px}
.depth{font-size:12px;line-height:1.7;margin-top:8px}
#message{padding:16px 4px;color:#555;white-space:pre-wrap}
a{color:#111}
details{margin-top:10px}
summary{cursor:pointer}
@media(max-width:430px){main{padding:9px}.match{padding:10px}.outcomes{gap:6px}}
</style>
</head>
<body>
<header>
  <h1>CRYSTAL EDGE</h1>
  <button id="refresh">Refresh</button>
</header>
<main>
  <div class="stats">
    <span class="stat" id="gamma">Gamma: waiting</span>
    <span class="stat" id="ws1">WS 1: disconnected</span>
    <span class="stat" id="ws2">WS 2: disconnected</span>
    <span class="stat" id="packets">Packets: 0</span>
    <span class="stat" id="rate">Packets/ms: 0</span>
    <span class="stat" id="latency">Request: —</span>
    <span class="stat" id="quoteAge">Quote age: —</span>
  </div>

  <div class="controls">
    <input id="search" placeholder="Search match or player">
    <select id="time">
      <option value="all">All upcoming</option>
      <option value="today">Today</option>
      <option value="tomorrow">Tomorrow</option>
    </select>
    <select id="sort">
      <option value="start">Start time</option>
      <option value="liquidity">Liquidity</option>
    </select>
  </div>

  <div class="sports">
    <button class="active" data-sport="all">All 3</button>
    <button data-sport="cricket">Cricket</button>
    <button data-sport="tennis">Tennis</button>
    <button data-sport="football">Football</button>
  </div>

  <div class="small" id="summary">Waiting for Worker data</div>
  <div id="message">Connecting to your Cloudflare Worker…</div>
  <div id="matches"></div>
</main>

<script>
"use strict";

/* YOUR EXISTING CLOUDFLARE WORKER */
const WORKER = "https://crystal-live-odds.mbeta3996.workers.dev";
const CLOB_WS = "wss://ws-subscriptions-clob.polymarket.com/ws/market";

const REFRESH_MS = 15000;
const BATCH_SIZE = 100;

let allMarkets = [];
let selectedSport = "all";
let sockets = [];
let packetCount = 0;
let firstPacketAt = 0;
let lastPacketAt = 0;
let lastQuoteAt = 0;
let requestMs = null;
let refreshing = false;
let reconnectTimer = null;

const quotes = new Map();
const subscribed = new Set();
const $ = id => document.getElementById(id);

function parseArray(v) {
  if (Array.isArray(v)) return v;
  try {
    const a = JSON.parse(v);
    return Array.isArray(a) ? a : [];
  } catch {
    return [];
  }
}

function decimal(price) {
  const p = Number(price);
  return p > 0 && p <= 1 ? (1 / p).toFixed(2) : "—";
}

function money(value) {
  const n = Number(value);
  return Number.isFinite(n) && n >= 0
    ? "€" + n.toFixed(2)
    : "—";
}

function updateStats() {
  $("packets").textContent = "Packets: " + packetCount;

  const elapsed = firstPacketAt
    ? Math.max(1, lastPacketAt - firstPacketAt)
    : 0;

  $("rate").textContent = "Packets/ms: " +
    (elapsed ? (packetCount / elapsed).toFixed(4) : "0");

  $("latency").textContent = "Request: " +
    (requestMs == null ? "—" : requestMs + " ms");

  $("quoteAge").textContent = "Quote age: " +
    (lastQuoteAt ? Math.max(0, Date.now() - lastQuoteAt) + " ms" : "—");

  $("ws1").textContent = "WS 1: " +
    (sockets[0] && sockets[0].readyState === WebSocket.OPEN
      ? "connected" : "disconnected");

  $("ws2").textContent = "WS 2: " +
    (sockets[1] && sockets[1].readyState === WebSocket.OPEN
      ? "connected" : "disconnected");
}

async function loadMarkets() {
  if (refreshing) return;
  refreshing = true;
  $("message").textContent = "Loading markets from your Cloudflare Worker…";

  const started = performance.now();

  try {
    const url = WORKER + "/matches?limit=200&offset=0&sport=all";
    const response = await fetch(url, { cache: "no-store" });

    requestMs = Math.round(performance.now() - started);
    if (!response.ok) throw new Error("Worker HTTP " + response.status);

    const result = await response.json();
    if (!result.success) throw new Error(result.error || "Worker error");

    const data = Array.isArray(result.data) ? result.data : [];
    allMarkets = data.filter(m =>
      ["cricket", "tennis", "football"].includes(m.sport) &&
      Array.isArray(m.tokenIds) && m.tokenIds.length >= 2
    );

    $("gamma").textContent = "Worker: connected";
    $("summary").textContent =
      "Matches returned: " + allMarkets.length +
      " · Scanned events: " + (result.scannedEvents ?? "—") +
      " · " + (result.timestamp || "");

    if (result.warnings && result.warnings.length) {
      $("message").textContent = "Worker warning: " + result.warnings.join("; ");
    } else {
      $("message").textContent = allMarkets.length
        ? ""
        : "Worker returned no eligible matches. Check /matches response and its warnings.";
    }

    subscribeTokens();
    render();
  } catch (error) {
    $("gamma").textContent = "Worker: error";
    $("message").textContent =
      "Could not load Worker data.\n" + error.message +
      "\nCheck the Worker /health endpoint and its /matches response.";
  } finally {
    refreshing = false;
    updateStats();
  }
}

function allTokens() {
  const set = new Set();
  for (const m of allMarkets) {
    for (const t of m.tokenIds || []) {
      if (t) set.add(String(t));
    }
  }
  return [...set];
}

function subscribeTokens() {
  const tokens = allTokens();
  if (!tokens.length) return;

  // Split subscriptions between two independent public connections.
  const chunks = [[], []];
  tokens.forEach((t, i) => chunks[i % 2].push(t));

  for (let i = 0; i < 2; i++) {
    const existing = sockets[i];
    const signature = chunks[i].join(",");
    if (existing && existing._signature === signature &&
        existing.readyState <= WebSocket.OPEN) continue;

    if (existing) {
      try { existing.close(); } catch {}
    }

    if (!chunks[i].length) {
      sockets[i] = null;
      continue;
    }

    const ws = new WebSocket(CLOB_WS);
    ws._signature = signature;
    sockets[i] = ws;

    ws.onopen = () => {
      $("ws" + (i + 1)).textContent = "WS " + (i + 1) + ": connected";
      // Public CLOB market-channel subscription.
      ws.send(JSON.stringify({
        assets_ids: chunks[i],
        type: "market"
      }));
      updateStats();
    };

    ws.onmessage = event => {
      packetCount++;
      const now = Date.now();
      if (!firstPacketAt) firstPacketAt = now;
      lastPacketAt = now;

      try {
        const data = JSON.parse(event.data);
        const events = Array.isArray(data) ? data : [data];
        for (const item of events) processPacket(item);
      } catch {}

      updateStats();
    };

    ws.onerror = () => {
      $("ws" + (i + 1)).textContent = "WS " + (i + 1) + ": error";
    };

    ws.onclose = () => {
      $("ws" + (i + 1)).textContent = "WS " + (i + 1) + ": disconnected";
      updateStats();
    };
  }
}

function processPacket(packet) {
  if (!packet || typeof packet !== "object") return;

  if (packet.event_type === "price_change" &&
      Array.isArray(packet.price_changes)) {
    for (const change of packet.price_changes) {
      updateQuote(change.asset_id, change);
    }
    return;
  }

  const token = packet.asset_id || packet.assetId || packet.token_id;
  if (token) updateQuote(token, packet);

  if (packet.event_type === "book" && token) {
    const bids = Array.isArray(packet.bids) ? packet.bids : [];
    const asks = Array.isArray(packet.asks) ? packet.asks : [];
    const bestBid = bids.reduce((best, x) =>
      Number(x.price) > Number(best?.price ?? 0) ? x : best, null);
    const bestAsk = asks.reduce((best, x) =>
      Number(x.price) < Number(best?.price ?? Infinity) ? x : best, null);

    updateQuote(token, {
      best_bid: bestBid?.price,
      best_ask: bestAsk?.price,
      bid_size: bestBid?.size,
      ask_size: bestAsk?.size
    });
  }
}

function updateQuote(token, packet) {
  if (!token || !packet) return;

  const key = String(token);
  const previous = quotes.get(key) || {};

  const bid = packet.best_bid ?? packet.bestBid ??
    packet.bid ?? packet.price_changes?.best_bid;
  const ask = packet.best_ask ?? packet.bestAsk ??
    packet.ask ?? packet.price_changes?.best_ask;

  const next = { ...previous, time: Date.now() };

  if (bid != null && Number(bid) > 0) next.bid = Number(bid);
  if (ask != null && Number(ask) > 0) next.ask = Number(ask);

  if (packet.bid_size != null) next.bidSize = Number(packet.bid_size);
  if (packet.ask_size != null) next.askSize = Number(packet.ask_size);

  if (packet.size != null && packet.side) {
    if (String(packet.side).toUpperCase() === "BUY") next.askSize = Number(packet.size);
    if (String(packet.side).toUpperCase() === "SELL") next.bidSize = Number(packet.size);
  }

  quotes.set(key, next);
  lastQuoteAt = Date.now();
  render();
}

function timeAllowed(m) {
  if (!m.startTime) return $("time").value === "all";

  const start = new Date(m.startTime);
  if (Number.isNaN(start.getTime())) return $("time").value === "all";

  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const tomorrow = new Date(+today + 86400000);
  const nextDay = new Date(+today + 172800000);

  if ($("time").value === "today") return start >= today && start < tomorrow;
  if ($("time").value === "tomorrow") return start >= tomorrow && start < nextDay;
  return start >= today;
}

function formatTime(value) {
  if (!value) return "Start time unavailable";
  const d = new Date(value);
  return Number.isNaN(d.getTime())
    ? "Start time unavailable"
    : d.toLocaleString();
}

function render() {
  const query = $("search").value.trim().toLowerCase();
  const sort = $("sort").value;

  let data = allMarkets.filter(m => {
    if (selectedSport !== "all" && m.sport !== selectedSport) return false;
    if (!timeAllowed(m)) return false;
    return (m.title + " " + (m.question || "")).toLowerCase().includes(query);
  });

  if (sort === "liquidity") {
    data.sort((a, b) => Number(b.liquidity || 0) - Number(a.liquidity || 0));
  } else {
    data.sort((a, b) =>
      (Date.parse(a.startTime || "") || Infinity) -
      (Date.parse(b.startTime || "") || Infinity)
    );
  }

  $("matches").innerHTML = "";

  if (!data.length) {
    if (!$("message").textContent) {
      $("message").textContent = "No matching markets available.";
    }
    return;
  }

  $("message").textContent = "";

  for (const m of data) {
    const card = document.createElement("article");
    card.className = "match";

    const top = document.createElement("div");
    top.className = "top";

    const title = document.createElement("div");
    title.className = "title";
    title.textContent = m.title;

    const sport = document.createElement("div");
    sport.className = "small";
    sport.textContent = m.sport.toUpperCase();

    top.append(title, sport);
    card.append(top);

    const time = document.createElement("div");
    time.className = "small";
    time.textContent = formatTime(m.startTime);
    card.append(time);

    const outcomes = document.createElement("div");
    outcomes.className = "outcomes";

    m.tokenIds.slice(0, 2).forEach((token, index) => {
      const label = (m.outcomes && m.outcomes[index]) || ("Outcome " + (index + 1));
      const q = quotes.get(String(token)) || {};

      const panel = document.createElement("div");
      panel.className = "outcome";

      const name = document.createElement("div");
      name.textContent = label;

      const buy = document.createElement("div");
      buy.className = "row";
      buy.innerHTML = "<span>BUY odds</span><strong></strong>";
      buy.querySelector("strong").textContent = decimal(q.ask);

      const sell = document.createElement("div");
      sell.className = "row";
      sell.innerHTML = "<span>SELL odds</span><strong></strong>";
      sell.querySelector("strong").textContent = decimal(q.bid);

      const depth = document.createElement("div");
      depth.className = "depth";
      depth.textContent =
        "Best ask size: " + (q.askSize != null ? money(q.askSize) : "—") +
        "\nBest bid size: " + (q.bidSize != null ? money(q.bidSize) : "—");

      panel.append(name, buy, sell, depth);
      outcomes.append(panel);
    });

    card.append(outcomes);

    const more = document.createElement("details");
    const summary = document.createElement("summary");
    summary.textContent = "Market details";
    more.append(summary);

    const detail = document.createElement("div");
    detail.className = "depth";
    detail.textContent =
      "Liquidity: " + money(m.liquidity) +
      "\nQuote data: public CLOB WebSocket";

    more.append(detail);

    if (m.url) {
      const link = document.createElement("a");
      link.href = m.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "Open on Polymarket";
      more.append(document.createElement("br"), link);
    }

    card.append(more);
    $("matches").append(card);
  }
}

$("refresh").addEventListener("click", loadMarkets);
$("search").addEventListener("input", render);
$("time").addEventListener("change", render);
$("sort").addEventListener("change", render);

document.querySelectorAll("[data-sport]").forEach(button => {
  button.addEventListener("click", () => {
    selectedSport = button.dataset.sport;
    document.querySelectorAll("[data-sport]").forEach(b =>
      b.classList.toggle("active", b === button)
    );
    render();
  });
});

loadMarkets();
setInterval(loadMarkets, REFRESH_MS);
setInterval(updateStats, 1000);
</script>
</body>
</html>
