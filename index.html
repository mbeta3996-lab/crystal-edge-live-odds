<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<title>CRYSTAL EDGE — Polymarket Live Sports</title>
<style>
:root{color-scheme:dark;--bg:#10131a;--panel:#191e28;--line:#303746;--text:#f2f4f8;--muted:#9ca7b8;--accent:#dbe4f2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:#10131af2;border-bottom:1px solid var(--line);padding:14px 14px 12px;backdrop-filter:blur(14px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:800;font-size:18px;letter-spacing:1.2px}
.sub{color:var(--muted);font-size:10px;letter-spacing:1.5px;margin-top:4px}
button,input,select{font:inherit;color:var(--text);background:#1b202b;border:1px solid var(--line);border-radius:9px;padding:10px}
button{cursor:pointer}
button:active{opacity:.7}
#refresh{width:40px;height:40px;font-size:18px;padding:0}
main{max-width:1050px;margin:auto;padding:14px}
.status{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pill{border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--muted);font-size:11px}
.pill b{color:var(--text);font-weight:600}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
#search{grid-column:1/-1;width:100%}
.sports,.dates{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.sports button,.dates button{white-space:nowrap;padding:8px 12px;font-size:12px}
button.active{background:#e5e9ef;color:#151923;border-color:#e5e9ef}
#summary{color:var(--muted);font-size:12px;margin:7px 0 12px}
.list{display:grid;grid-template-columns:1fr;gap:10px}
.match{border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:13px}
.matchhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.league{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:7px}
.matchtitle{font-size:14px;font-weight:700;line-height:1.4}
.when{font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}
.quotegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.quote{border:1px solid var(--line);border-radius:9px;padding:10px;min-width:0}
.outcome{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);margin-bottom:8px}
.quoteline{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:5px}
.qlabel{font-size:11px;color:var(--muted)}
.qvalue{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.liquidity{font-size:10px;color:var(--muted);margin-top:7px;line-height:1.4}
.actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}
.actions a,.actions button{font-size:11px;color:var(--text);text-decoration:none;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:transparent}
.extra{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.extra.open{display:block}
.marketrow{padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
.marketrow:last-child{border-bottom:0}
.marketrow small{display:block;color:var(--muted);margin-top:5px;overflow-wrap:anywhere}
.empty{padding:25px 10px;text-align:center;color:var(--muted);border:1px solid var(--line);border-radius:12px}
footer{padding:20px 0;color:var(--muted);font-size:11px;text-align:center}
@media(min-width:700px){.list{grid-template-columns:1fr 1fr}.filters{grid-template-columns:2fr 1fr}.quotegrid{gap:10px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div><div class="brand">◇ CRYSTAL EDGE</div><div class="sub">POLYMARKET · LIVE SPORTS</div></div>
    <button id="refresh" aria-label="Refresh" title="Refresh">↻</button>
  </div>
</header>
<main>
  <div class="status">
    <div class="pill">Worker <b id="workerStatus">Connecting</b></div>
    <div class="pill">Fixtures <b id="fixtureCount">—</b></div>
    <div class="pill">Updated <b id="updated">—</b></div>
    <div class="pill">Quotes <b id="quoteStatus">Waiting</b></div>
  </div>

  <div class="filters">
    <input id="search" type="search" placeholder="Search match or player…" autocomplete="off">
    <select id="sort">
      <option value="time">Sort: Match time</option>
      <option value="liquidity">Sort: Liquidity</option>
    </select>
  </div>
  <div class="sports" id="sports">
    <button class="active" data-sport="all">All sports</button>
    <button data-sport="cricket">Cricket</button>
    <button data-sport="tennis">Tennis</button>
    <button data-sport="football">Football</button>
    <button data-sport="soccer">Soccer</button>
  </div>
  <div class="dates" id="dates">
    <button class="active" data-date="all">All matches</button>
    <button data-date="today">Today</button>
    <button data-date="tomorrow">Tomorrow</button>
    <button data-date="upcoming">Upcoming</button>
  </div>
  <div id="summary">Loading matches from your existing Worker…</div>
  <div class="list" id="list"></div>
  <div style="text-align:center;margin-top:14px"><button id="more">Load more matches</button></div>
  <footer>Data source: your Cloudflare Worker and public Polymarket CLOB. Missing prices are shown as —.</footer>
</main>

<script>
(() => {
  "use strict";
  const API = "https://crystal-live-odds.mbeta3996.workers.dev";
  const PAGE_SIZE = 100;
  const QUOTE_BATCH = 12;

  const $ = id => document.getElementById(id);
  const state = {
    matches: [], sport: "all", date: "all", search: "",
    sort: "time", shown: 30, busy: false, quotes: new Map(),
    lastUpdated: null, requestId: 0
  };

  const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));

  function normalSport(value) {
    const s = String(value || "").toLowerCase();
    if (s.includes("cricket")) return "cricket";
    if (s.includes("tennis") || s.includes("atp") || s.includes("wta")) return "tennis";
    if (s.includes("soccer") || s.includes("football")) return "football";
    return s || "sport";
  }

  function fixtureTime(m) {
    const value = m.startTime || m.fixtureDate || m.startDate || "";
    const d = new Date(value);
    return Number.isNaN(d.getTime()) ? null : d;
  }

  function timeLabel(m) {
    const d = fixtureTime(m);
    if (!d) return "Time unavailable";
    return d.toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
  }

  function getSides(m) {
    if (Array.isArray(m.sides) && m.sides.length >= 2) return m.sides.slice(0, 2);
    if (Array.isArray(m.outcomes) && m.outcomes.length >= 2) return m.outcomes.slice(0, 2);
    return ["Outcome 1", "Outcome 2"];
  }

  function getMainMarket(m) {
    if (Array.isArray(m.markets)) {
      const primary = m.markets.find(x =>
        x && Array.isArray(x.outcomes) &&
        x.outcomes.length === 2 &&
        Array.isArray(x.tokenIds) &&
        x.tokenIds.length >= 2 &&
        !/completed match|total|over\/under|handicap|spread|set \d|games o\/u/i.test(x.question || "")
      );
      if (primary) return primary;
    }
    return m;
  }

  function tokensFor(m) {
    const market = getMainMarket(m);
    if (Array.isArray(market.outcomeTokens) && market.outcomeTokens.length >= 2) {
      return market.outcomeTokens.slice(0,2).map(t => ({
        name: t.outcome, id: String(t.tokenId || "")
      }));
    }
    const names = Array.isArray(market.outcomes) ? market.outcomes : getSides(m);
    const ids = Array.isArray(market.tokenIds) ? market.tokenIds : [];
    return names.slice(0,2).map((name,i) => ({name,id:String(ids[i] || "")}));
  }

  function isValidFixture(m) {
    if (!m || !m.title) return false;
    const sides = getSides(m);
    if (sides.length < 2 || !sides[0] || !sides[1]) return false;
    return sides[0] !== sides[1];
  }

  async function getJSON(path) {
    const response = await fetch(API + path, {cache:"no-store"});
    if (!response.ok) throw new Error("HTTP " + response.status + " from " + path.split("?")[0]);
    return response.json();
  }

  async function loadMatches() {
    if (state.busy) return;
    state.busy = true;
    const id = ++state.requestId;
    $("workerStatus").textContent = "Connecting…";
    $("summary").textContent = "Loading fixtures…";
    $("refresh").textContent = "…";

    try {
      const collected = [];
      let reportedTotal = 0;

      // The Worker response supports limit and offset; use small pages and stop
      // when the Worker has returned all available fixtures.
      for (let offset = 0; offset < 2000; offset += PAGE_SIZE) {
        const payload = await getJSON(
          "/matches?limit=" + PAGE_SIZE + "&offset=" + offset +
          "&sport=" + encodeURIComponent(state.sport)
        );
        if (id !== state.requestId) return;
        if (payload.success === false) throw new Error(payload.error || "Worker returned an error");
        const rows = Array.isArray(payload.data) ? payload.data : [];
        reportedTotal = Number(payload.count ?? payload.total ?? reportedTotal);
        collected.push(...rows);
        if (rows.length < PAGE_SIZE || (reportedTotal && collected.length >= reportedTotal)) break;
      }

      const seen = new Set();
      state.matches = collected.filter(m => {
        if (!isValidFixture(m)) return false;
        const key = String(m.id || m.url || m.title);
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });

      state.lastUpdated = new Date();
      $("workerStatus").textContent = "Connected";
      $("fixtureCount").textContent = state.matches.length;
      $("updated").textContent = state.lastUpdated.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
      state.shown = 30;
      render();
      loadVisibleQuotes();
    } catch (err) {
      $("workerStatus").textContent = "Error";
      $("summary").textContent = "Worker request failed: " + err.message;
      if (!state.matches.length) {
        $("list").innerHTML = '<div class="empty">Could not load matches. Check that the existing Worker is online and allows browser requests (CORS).</div>';
      }
    } finally {
      state.busy = false;
      $("refresh").textContent = "↻";
    }
  }

  function matchesFiltered() {
    const now = new Date();
    const tomorrow = new Date(now);
    tomorrow.setDate(tomorrow.getDate() + 1);
    const startToday = new Date(now.getFullYear(),now.getMonth(),now.getDate());
    const startTomorrow = new Date(tomorrow.getFullYear(),tomorrow.getMonth(),tomorrow.getDate());
    const startDayAfter = new Date(tomorrow.getFullYear(),tomorrow.getMonth(),tomorrow.getDate()+1);

    let arr = state.matches.filter(m => {
      const sport = normalSport(m.sport);
      if (state.sport !== "all" && sport !== normalSport(state.sport)) return false;
      const d = fixtureTime(m);
      if (state.date !== "all") {
        if (!d) return false;
        if (state.date === "today" && !(d >= startToday && d < startTomorrow)) return false;
        if (state.date === "tomorrow" && !(d >= startTomorrow && d < startDayAfter)) return false;
        if (state.date === "upcoming" && d < startToday) return false;
      }
      const q = state.search.trim().toLowerCase();
      if (q && ![m.title,m.question,...getSides(m),m.sport].join(" ").toLowerCase().includes(q)) return false;
      return true;
    });

    arr.sort((a,b) => {
      if (state.sort === "liquidity") return Number(b.liquidity || 0) - Number(a.liquidity || 0);
      const ta = fixtureTime(a)?.getTime() ?? Infinity;
      const tb = fixtureTime(b)?.getTime() ?? Infinity;
      return ta - tb;
    });
    return arr;
  }

  function formatOdds(value) {
    const n = Number(value);
    if (!Number.isFinite(n) || n <= 0 || n >= 1) return "—";
    return (1/n).toFixed(2);
  }

  function findPriceValue(obj) {
    if (obj == null) return null;
    if (typeof obj === "number" || typeof obj === "string") {
      const n = Number(obj);
      return Number.isFinite(n) ? n : null;
    }
    for (const key of ["price","bestAsk","bestBid","value","buyPrice","sellPrice"]) {
      if (obj[key] !== undefined && obj[key] !== null) {
        const n = Number(obj[key]);
        if (Number.isFinite(n)) return n;
      }
    }
    if (obj.data && obj.data !== obj) return findPriceValue(obj.data);
    return null;
  }

  function topBook(book, side) {
    if (!book || typeof book !== "object") return null;
    const levels = Array.isArray(book[side]) ? book[side] :
      Array.isArray(book.data?.[side]) ? book.data[side] : [];
    if (!levels.length) return null;
    const parsed = levels.map(level => ({
      price:Number(level.price),
      size:Number(level.size ?? level.amount ?? level.quantity)
    })).filter(x => Number.isFinite(x.price) && x.price > 0 && x.price < 1);
    if (!parsed.length) return null;
    parsed.sort((a,b) => side === "asks" ? a.price-b.price : b.price-a.price);
    return parsed[0];
  }

  async function loadQuote(tokenId) {
    if (!tokenId) return null;
    if (state.quotes.has(tokenId)) return state.quotes.get(tokenId);

    const quote = {buy:null,sell:null,bid:null,ask:null};
    state.quotes.set(tokenId, quote);

    const requests = await Promise.allSettled([
      getJSON("/price?token_id=" + encodeURIComponent(tokenId) + "&side=BUY"),
      getJSON("/price?token_id=" + encodeURIComponent(tokenId) + "&side=SELL"),
      getJSON("/book?token_id=" + encodeURIComponent(tokenId))
    ]);

    if (requests[0].status === "fulfilled") quote.buy = findPriceValue(requests[0].value);
    if (requests[1].status === "fulfilled") quote.sell = findPriceValue(requests[1].value);

    if (requests[2].status === "fulfilled") {
      const book = requests[2].value;
      quote.ask = topBook(book, "asks");
      quote.bid = topBook(book, "bids");
      if (quote.buy == null && quote.ask) quote.buy = quote.ask.price;
      if (quote.sell == null && quote.bid) quote.sell = quote.bid.price;
    }
    return quote;
  }

  function quoteHTML(token) {
    const q = state.quotes.get(token.id);
    if (!q) return `
      <div class="quoteline"><span class="qlabel">BACK</span><span class="qvalue">—</span></div>
      <div class="quoteline"><span class="qlabel">LAY</span><span class="qvalue">—</span></div>
      <div class="liquidity">Loading quote…</div>`;
    const backPrice = q.ask?.price ?? q.buy;
    const layPrice = q.bid?.price ?? q.sell;
    const backSize = q.ask?.size;
    const laySize = q.bid?.size;
    return `
      <div class="quoteline"><span class="qlabel">BACK</span><span class="qvalue">${formatOdds(backPrice)}</span></div>
      <div class="quoteline"><span class="qlabel">LAY</span><span class="qvalue">${formatOdds(layPrice)}</span></div>
      <div class="liquidity">Ask size: ${backSize != null && Number.isFinite(backSize) ? escapeHTML(backSize.toLocaleString(undefined,{maximumFractionDigits:2})) : "—"}<br>Bid size: ${laySize != null && Number.isFinite(laySize) ? escapeHTML(laySize.toLocaleString(undefined,{maximumFractionDigits:2})) : "—"}<br>Size units follow the Worker’s order-book response.</div>`;
  }

  function relatedMarkets(m) {
    const list = Array.isArray(m.markets) ? m.markets : [];
    return list.filter(x => x && x.question && x.question !== m.question)
      .slice(0,25).map(x => `
        <div class="marketrow">${escapeHTML(x.question)}
          <small>${escapeHTML((x.outcomes || []).join(" · "))} | Liquidity: ${x.liquidity == null ? "—" : escapeHTML(Number(x.liquidity).toLocaleString(undefined,{maximumFractionDigits:2}))}</small>
        </div>`).join("") || '<div class="marketrow">No additional markets supplied.</div>';
  }

  function cardHTML(m,index) {
    const sides = getSides(m);
    const tokens = tokensFor(m);
    const key = escapeHTML(String(m.id || index));
    const sport = escapeHTML(normalSport(m.sport));
    const link = /^https:\/\/polymarket\.com\//.test(m.url || "") ? m.url : "";
    const linkHTML = link ? `<a href="${escapeHTML(link)}" target="_blank" rel="noopener noreferrer">Open on Polymarket ↗</a>` : "";
    const marketCount = Array.isArray(m.markets) ? m.markets.length : 1;

    return `<article class="match" data-id="${key}">
      <div class="matchhead">
        <div style="min-width:0"><div class="league">${sport}</div><div class="matchtitle">${escapeHTML(m.title)}</div></div>
        <div class="when">${escapeHTML(timeLabel(m))}</div>
      </div>
      <div class="quotegrid">
        ${tokens.slice(0,2).map(t => `<div class="quote">
          <div class="outcome">${escapeHTML(t.name || "Outcome")}</div>
          ${quoteHTML(t)}
        </div>`).join("")}
      </div>
      <div class="actions">${linkHTML}<button type="button" data-detail="${key}">All markets (${marketCount})</button></div>
      <div class="extra" id="extra-${key}">${relatedMarkets(m)}</div>
    </article>`;
  }

  function render() {
    const all = matchesFiltered();
    const shown = all.slice(0,state.shown);
    $("summary").textContent = `${all.length} matches · showing ${shown.length}` +
      (state.search ? ` · search: ${state.search}` : "");
    $("list").innerHTML = shown.length ? shown.map(cardHTML).join("") :
      '<div class="empty">No matches found for these filters.</div>';
    $("more").style.display = shown.length < all.length ? "inline-block" : "none";

    $("list").querySelectorAll("[data-detail]").forEach(btn => {
      btn.addEventListener("click", () => {
        const extra = $("extra-" + btn.dataset.detail);
        if (extra) extra.classList.toggle("open");
      });
    });
  }

  async function loadVisibleQuotes() {
    const current = matchesFiltered().slice(0,state.shown);
    const targets = [];
    for (const m of current.slice(0,QUOTE_BATCH)) {
      for (const token of tokensFor(m).slice(0,2)) {
        if (token.id && !state.quotes.has(token.id)) targets.push(token.id);
      }
    }
    if (!targets.length) {
      $("quoteStatus").textContent = state.quotes.size ? "Loaded" : "Waiting";
      return;
    }
    $("quoteStatus").textContent = "Fetching…";
    // Keep browser requests modest; never request every token for all fixtures at once.
    for (let i=0; i<targets.length; i+=6) {
      await Promise.all(targets.slice(i,i+6).map(loadQuote));
    }
    $("quoteStatus").textContent = "Loaded";
    render();
  }

  $("refresh").addEventListener("click", () => {
    state.quotes.clear();
    loadMatches();
  });
  $("search").addEventListener("input", e => {
    state.search = e.target.value;
    state.shown = 30;
    render();
    loadVisibleQuotes();
  });
  $("sort").addEventListener("change", e => {
    state.sort = e.target.value;
    render();
    loadVisibleQuotes();
  });
  $("sports").querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => {
    $("sports").querySelectorAll("button").forEach(b => b.classList.toggle("active",b===btn));
    state.sport = btn.dataset.sport;
    state.matches = [];
    state.quotes.clear();
    loadMatches();
  }));
  $("dates").querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => {
    $("dates").querySelectorAll("button").forEach(b => b.classList.toggle("active",b===btn));
    state.date = btn.dataset.date;
    state.shown = 30;
    render();
    loadVisibleQuotes();
  }));
  $("more").addEventListener("click", () => {
    state.shown += 30;
    render();
    loadVisibleQuotes();
  });

  loadMatches();
})();
</script>
</body>
</html>
